  }
  let wxBusy = false, wxAgain = false;
  async function fillWeather(ids, force) {
    if (!S.settings.weatherAuto && !force) return 0;
    if (!navigator.onLine) return 0;
    if (wxBusy) { wxAgain = true; return 0; }
    wxBusy = true;

      const list = (ids ? S.acts.filter((a) => ids.includes(a.id)) : S.acts)
        .filter((a) => !a.sample && a.thumb && a.thumb.length && (force || !a.weather || (a.weather.err && Date.now() - a.weather.at > 864e5)))

  /* ═════════ 대회 준비: 훈련 페이스 · 마스터 스케줄 · 미션 ═════════ */
  const PHASES = {
    base: { label: '기초기', color: '#256abf', desc: '유산소 기반과 주간 거리를 쌓는 시기' },
    build: { label: '강화기', color: '#3987e5', desc: '템포·인터벌로 역치와 스피드를 끌어올리는 시기' },
    peak: { label: '특화기', color: '#86b6ef', desc: '마라톤 페이스 롱런으로 대회 강도에 적응하는 시기' },
    taper: { label: '테이퍼', color: '#F2B84B', desc: '거리를 줄여 피로를 빼고 대회를 준비하는 시기' },
  };
  function trainingPaces() {
    const g = S.settings;
    if (!g.goalTime || !g.goalDist) return null;
    const race = g.goalTime / g.goalDist * 1000;
    const mar = g.goalTime * Math.pow(42195 / g.goalDist, 1.06) / 42.195; // 마라톤 환산 페이스
    return {
      race, mp: mar,

      tempo: mar * 0.94, interval: mar * 0.86,

  }
  const paceRange = (r) => `${fmtPace(r[0])}–${fmtPace(r[1])}`;
  function recentBase() {
    const now = Date.now(), from = now - 28 * 864e5;
    const list = S.acts.filter((a) => a.start > from);
    const km = list.reduce((s, a) => s + a.summary.dist, 0) / 1000 / 4;
    const longest = Math.max(0, ...list.map((a) => a.summary.dist / 1000));
    return { km: Math.max(20, km), longest: Math.max(10, longest) };
  }
  function autoPeakKm(dist, goalTime) {
    if (dist >= 40000) return goalTime <= 10800 ? 85 : goalTime <= 11700 ? 70 : goalTime <= 12600 ? 62 : goalTime <= 14400 ? 52 : 42;
    if (dist >= 20000) return goalTime <= 5400 ? 60 : goalTime <= 6000 ? 50 : 40;
    return 40;
  }
  function buildPlan() {
    const g = S.settings;
    if (!g.goalDate || !g.goalTime || !g.goalDist) return { err: '대회 날짜와 목표 기록을 먼저 정해 주세요' };
    const raceDay = new Date(g.goalDate + 'T00:00:00');
    const startMon = monday(Date.now()), raceMon = monday(+raceDay);
    const nW = Math.round((raceMon - startMon) / (7 * 864e5)) + 1;
    if (nW < 4) return { err: '대회까지 4주 이상 남아 있어야 스케줄을 만들 수 있어요' };
    const full = g.goalDist >= 40000, half = !full && g.goalDist >= 20000;
    const taperW = full ? 3 : half ? 2 : 1;
    let peakW = full ? 6 : half ? 4 : 3, buildW = full ? 8 : half ? 6 : 5;
    const rem = nW - taperW;
    if (rem < peakW + buildW + 2) { peakW = Math.max(2, Math.round(rem * 0.35)); buildW = Math.max(1, Math.round(rem * 0.4)); }
    const baseW = Math.max(0, rem - peakW - buildW);
    const P = trainingPaces();
    const B = recentBase();
    const peakKm = g.peakKm > 0 ? g.peakKm : Math.max(autoPeakKm(g.goalDist, g.goalTime), Math.round(B.km * 1.1));
    const peakLong = full ? (g.goalTime <= 11700 ? 32 : 30) : half ? 21 : 15;
    const runs = Math.max(3, Math.min(7, g.runsPerWeek || 5));
    const weeks = [];
    const rampW = baseW + buildW; // 이 기간 동안 거리 증가
    let prevKm = B.km, prevLong = Math.min(B.longest, peakLong);
    for (let i = 0; i < nW; i++) {
      const start = new Date(startMon); start.setDate(start.getDate() + 7 * i);
      const phase = i < baseW ? 'base' : i < baseW + buildW ? 'build' : i < rem ? 'peak' : 'taper';
      const ti = i - rem; // 테이퍼 주차
      const isRace = i === nW - 1;
      let cut = phase !== 'taper' && i > 0 && (i + 1) % 4 === 0 && i < rem - 1;
      let km, long;
      if (phase === 'taper') {
        const f = full ? [0.75, 0.55, 0.35][ti] : half ? [0.7, 0.45][ti] : 0.55;
        km = peakKm * f;
        long = isRace ? g.goalDist / 1000 : full ? [24, 16][ti] : 14;
      } else {
        const prog = rampW > 0 ? Math.min(1, (i + 1) / Math.max(1, rampW)) : 1;
        const target = phase === 'peak' ? peakKm * (i === rem - 1 ? 0.92 : 1) : B.km + (peakKm * 0.92 - B.km) * prog;
        km = Math.min(target, prevKm * 1.1);

        if (phase === 'build') return k === 0 ? `템포 ${Math.min(40, 20 + (i - baseW) * 3)}분 @${fmtPace(P.tempo)}` : `인터벌 ${(i - baseW) % 2 ? '5×1km' : '6×800m'} @${fmtPace(P.interval)}`;
        if (phase === 'peak') return k === 0 ? `템포 2×5km @${fmtPace(P.tempo)}` : `인터벌 4×1.6km @${fmtPace(P.interval)}`;
        return isRace ? `마라톤 페이스 5km @${fmtPace(P.race)}` : `마라톤 페이스 ${full ? 8 : 5}km @${fmtPace(P.race)}`;
      };

      for (const d of easyDows) days.push({ dow: d, label: d === 1 ? '회복주' : '이지런', km: isRace && d === 6 ? 4 : easyKm, kind: 'easy' });

  // 미션(마일스톤): 기록에서 자동 판정
  function missions() {

    else if (half) list.push(timeM(5000, '5K', 0.4));
    list.push({ id: 'mp', title: `목표 페이스(${fmtPace(P.race)})로 ${mpDist}km 이상`, due: dueAt(0.8), done: firstDone((a) => a.summary.pace <= P.race + 5 && a.summary.dist >= mpDist * 1000 * 0.98), prog: Math.min(1, mpBest / mpDist), cur: mpBest ? `최장 ${mpBest.toFixed(1)}km` : '기록 없음' });
    list.push({ id: 'ef', title: '이지·롱런 심박 효율 3% 향상', sub: '스케줄 시작 시점 대비', due: dueAt(0.6), done: fin(efGain) && efGain >= 3 ? Date.now() : null, prog: fin(efGain) ? Math.max(0, Math.min(1, efGain / 3)) : 0, cur: fin(efGain) ? `${efGain >= 0 ? '+' : ''}${efGain.toFixed(1)}%` : '데이터 부족' });
    list.push({ id: 'pred', title: '예상 기록이 목표에 도달', due: dueAt(0.95), done: G && fin(G.now) && G.now <= g.goalTime ? Date.now() : null, prog: G && fin(G.now) ? Math.min(1, g.goalTime / G.now) : 0, cur: G && fin(G.now) ? `예상 ${fmtDur(G.now)}` : '기록 없음' });
    for (const m of S.missions || []) list.push({ id: m.id, title: m.title, due: m.due ? +new Date(m.due + 'T23:59:00') : null, done: m.done || null, prog: m.done ? 1 : 0, custom: true });
    const now = Date.now();
    for (const m of list) m.state = m.done ? 'done' : m.due && m.due < now ? 'late' : 'open';
    list.sort((a, b) => (a.state === 'done') - (b.state === 'done') || (a.due || 9e15) - (b.due || 9e15));
    return list;
  }
  function checkpoints() {
    const plan = S.plan;
    if (!plan) return [];
    const out = [];
    let idx = 0;
    for (const ph of ['base', 'build', 'peak']) {
      idx += plan.phases[ph];
      if (!plan.phases[ph] || idx < 1) continue;
      const w = plan.weeks[idx - 1];
      out.push({ ph, at: w.start + 6 * 864e5, label: `${PHASES[ph].label} 종료 점검` });
    }
    return out;
  }

        <label class="field row"><span>최대 심박<small>${maxSeen ? `기록상 최고 ${Math.round(maxSeen)} bpm` : '모르면 최근 레이스 최고 심박'}</small></span><input type="number" inputmode="numeric" data-num="hrMax" value="${st.hrMax}" min="120" max="230"></label>
        <label class="field row"><span>안정 심박<small>아침에 일어나 누운 상태</small></span><input type="number" inputmode="numeric" data-num="hrRest" value="${st.hrRest}" min="30" max="100"></label>
        <div class="field row"><span>심박 존 기준</span>${seg('zoneMethod', [['hrr', '여유심박'], ['max', '최대심박 %']])}</div>
        <div class="field row"><span>성별<small>훈련 부하(TRIMP) 계수</small></span>${seg('sex', [['m', '남'], ['f', '여']])}</div>
      </section>
      <section class="card">
        <h3>케이던스 · 목표 · 지도</h3>
        <div class="field row"><span>GPX 케이던스 값<small>한쪽 발 기준(80~95)이면 ×2 해서 spm으로</small></span>${seg('cadMode', [['auto', '자동'], ['x1', '그대로'], ['x2', '×2']])}</div>
        <label class="field row"><span>주간 목표 거리<small>km, 0이면 표시 안 함</small></span><input type="number" inputmode="decimal" data-num="weekGoal" value="${st.weekGoal}" min="0" max="300"></label>
        <div class="field row"><span>지도 스타일</span>${seg('mapStyle', [['dark', '다크'], ['light', '라이트']])}</div>
      </section>
      <section class="card">
        <h3>데이터</h3>
        <p class="kv"><span>저장된 기록</span><b>${S.acts.length}개${est ? ` · ${est}` : ''}</b></p>
        <p class="kv"><span>저장소 보호</span><b>${!S.storageOK ? '사용 불가(임시 메모리)' : persisted ? '영구 저장 ✓' : '일반(브라우저가 정리할 수 있음)'}</b></p>
        <p class="fine">기록은 이 기기 브라우저(IndexedDB)에만 있어요. 브라우저 데이터 삭제·앱 제거 시 사라지니 가끔 백업 파일을 내보내 두세요.</p>
        <div class="btn-col">
          <button class="btn primary" data-act="export">백업 파일 내보내기</button>
          ${navigator.canShare ? html`<button class="btn ghost" data-act="share-backup">백업 공유하기 (드라이브 등)</button>` : ''}
          <button class="btn ghost" data-act="restore">백업에서 복원</button>
          ${nSample ? html`<button class="btn ghost" data-act="del-samples">샘플 데이터 ${nSample}개 삭제</button>` : html`<button class="btn ghost" data-act="samples">샘플 데이터 추가</button>`}
          <button class="btn danger-ghost" data-act="wipe">모든 기록 삭제</button>
        </div>
      </section>
      <section class="card help">
        <h3>지표 설명</h3>
        <details><summary>경사 보정 페이스 (GAP)</summary><p>오르막·내리막에서 든 노력을 평지 페이스로 환산한 값. 경사별 에너지 비용 곡선(Strava식 근사)을 고도 30m 창 경사에 적용해요. 언덕 많은 코스끼리도 공정하게 비교할 수 있어요.</p></details>
        <details><summary>심박 효율 EF (m/beat)</summary><p>경사 보정 거리 ÷ 총 심박수. 심박 1회에 몇 m를 가는지로, 같은 유형의 러닝에서 오르면 유산소 효율(러닝 이코노미)이 좋아진 신호예요. 1km당 심박수는 그 역수(1000/EF)예요.</p></details>
        <details><summary>디커플링 (Pa:HR)</summary><p>이동 시간 기준 전반과 후반의 EF를 비교한 저하율. 일정한 페이스 러닝에서 5% 미만이면 그 강도·시간에 대한 유산소 지구력이 충분하다는 뜻이에요. 인터벌에는 의미가 적어요.</p></details>
        <details><summary>케이던스 · 보폭</summary><p>속도 = 케이던스(분당 걸음) × 보폭. 워치 GPX의 cad 값은 보통 한쪽 발 기준이라 자동으로 2배 해요. 보폭 = 속도 ÷ (케이던스/60).</p></details>
        <details><summary>훈련 부하 TRIMP · CTL · ATL · TSB</summary><p>TRIMP는 여유심박 비율에 지수 가중치를 준 Banister 방식. 일별 TRIMP의 42일/7일 지수이동평균이 CTL(체력)/ATL(피로), 차이가 TSB(컨디션)예요.</p></details>
        <details><summary>가져올 수 있는 파일</summary><p>GPX(심박·케이던스 확장 포함), TCX, .gpx.gz. 삼성헬스 GPX에 케이던스가 없으면 ‘개인 데이터 다운로드’의 해당 운동 live_data JSON을 가져오면 같은 시간대 기록에 케이던스·심박을 합쳐요. 백업 파일(.json)도 여기서 바로 복원돼요.</p></details>
        <details><summary>정지 시간 처리</summary><p>속도가 0.8 m/s 미만이거나 케이던스가 0이면 정지로 보고 이동 시간·페이스 계산에서 뺍니다.</p></details>
      </section>
      <p class="fine center">RunLog ${VERSION} · 서버 없이 이 기기에서만 동작해요</p>
    `);
    const v = $('#view');
    v.querySelectorAll('[data-num]').forEach((inp) => inp.addEventListener('change', () => {
      const k = inp.dataset.num, val = parseFloat(inp.value);
      if (!fin(val)) { inp.value = st[k]; return; }
      updateSetting(k, val);
    }));
    v.querySelectorAll('.seg[data-key]').forEach((sg) => sg.addEventListener('click', (e) => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      sg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      const val = b.dataset.v === 'true' ? true : b.dataset.v === 'false' ? false : b.dataset.v;
      updateSetting(sg.dataset.key, val);
    }));
    v.querySelectorAll('.shoe').forEach((row) => {
      const sh = shoeById(row.dataset.sid); if (!sh) return;
      row.querySelector('.shoe-name').addEventListener('change', (e) => { sh.name = e.target.value.trim() || sh.name; saveSettings(); toast('신발 이름을 바꿨어요', 1200); });
      row.querySelector('.shoe-start').addEventListener('change', (e) => { sh.startKm = Math.max(0, +e.target.value || 0); saveSettings(); route(); });
      row.querySelector('.shoe-limit').addEventListener('change', (e) => { sh.limitKm = Math.max(0, +e.target.value || 0); saveSettings(); route(); });
    });
  }
  let recomputeT = 0;
  function updateSetting(k, val) {
    if (k === 'hrMax' && (val < 120 || val > 230)) { toast('최대 심박은 120~230 사이로 입력해 주세요'); return; }
    if (k === 'hrRest' && (val < 30 || val > 100)) { toast('안정 심박은 30~100 사이로 입력해 주세요'); return; }
    if (S.settings[k] === val) return;
    S.settings[k] = val;
    if (k === 'hrMax' || k === 'hrRest') S.settings.touched = true;
    saveSettings();
    if (ANALYSIS_KEYS.includes(k)) { clearTimeout(recomputeT); recomputeT = setTimeout(recomputeAll, 600); }
    else toast('저장했어요', 1200);
  }

  /* ───────── 백업 ───────── */
  async function buildBackup() {
    const r1 = (a, d) => Array.from(a, (x) => (fin(x) ? +x.toFixed(d) : null));
    const acts = [];
    for (const a of S.acts) {
      const st = await DB.get('streams', a.id);
      if (!st) continue;
      const R = st.raw;
      acts.push({
        id: a.id, start: a.start, name: a.name, type: a.type, typeAuto: a.typeAuto, note: a.note, shoe: a.shoe, shoeId: a.shoeId || '', weather: a.weather || null, source: a.source, sample: a.sample,
        raw: { t: r1(R.t, 1), lat: r1(R.lat, 6), lon: r1(R.lon, 6), ele: r1(R.ele, 1), hr: r1(R.hr, 0), cad: r1(R.cad, 0), pwr: r1(R.pwr, 0), dist: R.dist ? r1(R.dist, 1) : null },
      });
    }
    const { touched, tipDismissed, ...settings } = S.settings;
    void touched; void tipDismissed;
    const plan = S.plan ? { ...S.plan, weeks: S.plan.weeks.map(({ act, state, ...w }) => (void act, void state, w)) } : null;
    return { app: 'runlog', version: 2, exported: new Date().toISOString(), settings, plan, missions: S.missions, acts };
  }
  const backupName = () => `runlog-backup-${ymd(new Date())}.json`;
  async function exportBackup() {
    if (!S.acts.length) { toast('내보낼 기록이 없어요'); return; }
    toast('백업 파일 만드는 중…', 30000);
    const data = JSON.stringify(await buildBackup());
    const filename = backupName();
    const framed = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data }); toast('백업 파일을 저장했어요'); return; }
      }
    } catch (e) { toast('저장을 취소했거나 실패했어요'); return; }
    if (framed) { toast('이 화면에서는 파일 저장이 막혀 있어요. 앱을 브라우저에서 직접 열어 주세요', 4500); return; }
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(`백업 파일(${(blob.size / 1048576).toFixed(1)} MB)을 내려받았어요`);
  }
  async function shareBackup() {
    try {
      const data = JSON.stringify(await buildBackup());
      const file = new File([data], backupName(), { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'RunLog 백업' });
      else toast('이 환경에서는 파일 공유를 지원하지 않아요');
    } catch (e) { if (e && e.name !== 'AbortError') toast('공유하지 못했어요'); }
  }
  async function restoreBackup(file) {
    try {
      toast('백업 읽는 중…', 60000);
      const j = JSON.parse(await readFileText(file));
      if (j.app !== 'runlog' || !Array.isArray(j.acts)) throw new Error('RunLog 백업 파일이 아니에요');
      if (j.settings) { S.settings = { ...S.settings, ...j.settings, touched: true }; await saveSettings(); }
      if (j.plan) { S.plan = j.plan; await savePlan(); }
      if (Array.isArray(j.missions)) { S.missions = j.missions; await saveMissions(); }
      let n = 0, dup = 0;
      const F64 = (a) => Float64Array.from(a, (x) => (x == null ? NaN : x)), F32 = (a) => Float32Array.from(a, (x) => (x == null ? NaN : x));
      for (const b of j.acts) {
        const R = b.raw;
        const rawData = { t: F64(R.t), lat: F64(R.lat), lon: F64(R.lon), ele: F32(R.ele), hr: F32(R.hr), cad: F32(R.cad), pwr: F32(R.pwr || []), dist: R.dist ? F64(R.dist) : null };
        if (rawData.pwr.length !== rawData.t.length) rawData.pwr = new Float32Array(rawData.t.length).fill(NaN);
        const r = await importParsed({ name: b.name, start: b.start, raw: rawData }, { name: b.name, type: b.typeAuto ? '' : b.type, note: b.note, shoe: b.shoe, shoeId: b.shoeId || '', weather: b.weather || null, source: b.source, sample: b.sample });
        if (r.ok) n++; else if (r.dup) dup++;
      }
      sortActs(); S.cache.clear();
      toast(`${n}개 기록을 복원했어요${dup ? ` · ${dup}개 중복 건너뜀` : ''}`, 3500);
      route();
    } catch (e) { toast(`복원 실패: ${e.message || e}`, 4000); }
  }

  /* ───────── 전역 이벤트 ───────── */
  document.addEventListener('click', async (e) => {
    const runEl = e.target.closest('[data-run]');
    if (runEl) { S.cameFromList = true; go('run-' + runEl.dataset.run); return; }
    const goEl = e.target.closest('[data-go]');
    if (goEl) { go(goEl.dataset.go); return; }
    const msT = e.target.closest('[data-ms-toggle]');
    if (msT) { const m = S.missions.find((x) => x.id === msT.dataset.msToggle); if (m) { m.done = m.done ? null : Date.now(); await saveMissions(); route(); } return; }
    const msD = e.target.closest('[data-ms-del]');
    if (msD) { S.missions = S.missions.filter((x) => x.id !== msD.dataset.msDel); await saveMissions(); route(); return; }
    const shA = e.target.closest('[data-shoe-act]');
    if (shA) {
      const row = shA.closest('[data-sid]'); const sh = row && shoeById(row.dataset.sid); if (!sh) return;
      const k2 = shA.dataset.shoeAct;
      if (k2 === 'default') S.settings.defaultShoe = S.settings.defaultShoe === sh.id ? '' : sh.id;
      else if (k2 === 'race') S.settings.raceShoe = S.settings.raceShoe === sh.id ? '' : sh.id;
      else if (k2 === 'retire') sh.retired = !sh.retired;
      else if (k2 === 'del') {
        const used = shoeUsage(sh.id).n;
        if (!(await dialog({ title: `'${sh.name}'을 삭제할까요?`, body: used ? `${used}개 기록에서 신발 정보가 빠져요. 그만 신는 신발이면 '은퇴'를 권해요.` : '', ok: '삭제', danger: true }))) return;
        S.settings.shoes = shoeList().filter((x) => x.id !== sh.id);
        for (const a of S.acts) if (a.shoeId === sh.id) { a.shoeId = ''; DB.put('acts', a).catch(() => {}); }
      }
      saveSettings(); route(); return;
    }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const k = act.dataset.act;
    if (k === 'import') $('#fileInput').click();
    else if (k === 'samples') addSamples();
    else if (k === 'dismiss-tip') { S.settings.tipDismissed = true; saveSettings(); route(); }
    else if (k === 'export') exportBackup();
    else if (k === 'race-edit') { S.raceEdit = !S.raceEdit; route(); }
    else if (k === 'plan-make') {
      const pl = buildPlan();
      if (pl.err) { toast(pl.err, 3000); return; }
      S.plan = pl; await savePlan(); S.raceEdit = false;
      toast(`${pl.weeks.length}주 마스터 스케줄을 만들었어요`); route();
    } else if (k === 'plan-del') {
      if (!(await dialog({ title: '마스터 스케줄을 삭제할까요?', body: '러닝 기록은 그대로 남아요.', ok: '삭제', danger: true }))) return;
      S.plan = null; await DB.del('kv', 'plan').catch(() => {}); route();
    } else if (k === 'ms-add') {
      const t = $('#msTitle').value.trim(); if (!t) { toast('미션 이름을 입력해 주세요'); return; }
      S.missions.push({ id: 'm' + Date.now(), title: t, due: $('#msDue').value || '', done: null });
      await saveMissions(); route();
    } else if (k === 'shoe-add') {
      const t = $('#newShoe').value.trim(); if (!t) { toast('신발 이름을 입력해 주세요'); return; }
      S.settings.shoes = [...shoeList(), { id: 'sh' + Date.now(), name: t, startKm: 0, limitKm: 600, retired: false }];
      saveSettings(); toast('신발을 등록했어요', 1400); route();
    } else if (k === 'wx-all') {
      if (!navigator.onLine) { toast('인터넷에 연결되어 있을 때 다시 시도해 주세요'); return; }
      toast('날씨를 불러오는 중…', 30000);
      const n = await fillWeather(null, true);
      toast(n ? `${n}개 기록에 날씨를 채웠어요` : '채울 수 있는 기록이 없거나 날씨를 받지 못했어요', 3000);
    } else if (k === 'wx-one') {
      const a = S.acts.find((x) => x.id === +act.dataset.id); if (!a) return;
      toast('날씨를 불러오는 중…', 20000);
      a.weather = null;
      const n = await fillWeather([a.id], true);
      toast(n ? '날씨를 기록했어요' : '날씨를 받지 못했어요. 인터넷 연결을 확인해 주세요', 2500);
      if (n) route();
    }
    else if (k === 'share-backup') shareBackup();
    else if (k === 'restore') $('#backupInput').click();
    else if (k === 'del-samples') {
      const ids = S.acts.filter((a) => a.sample).map((a) => a.id);
      if (!(await dialog({ title: `샘플 데이터 ${ids.length}개를 삭제할까요?`, ok: '삭제', danger: true }))) return;
      for (const id of ids) { await DB.del('acts', id); await DB.del('streams', id); }
      S.acts = S.acts.filter((a) => !a.sample); S.cache.clear();
      toast('샘플 데이터를 삭제했어요'); route();
    } else if (k === 'wipe') {
      if (!(await dialog({ title: '모든 기록을 삭제할까요?', body: `${S.acts.length}개 기록이 이 기기에서 영구 삭제돼요. 먼저 백업을 내보내 두는 걸 권해요.`, ok: '모두 삭제', danger: true }))) return;
      await DB.clear('acts'); await DB.clear('streams');
      S.acts = []; S.cache.clear();
      toast('모든 기록을 삭제했어요'); route();
    }
  });

  function bindShell() {
    $('#tabRuns').addEventListener('click', () => go('runs'));
    $('#tabStats').addEventListener('click', () => go('stats'));
    $('#tabPrefs').addEventListener('click', () => go('prefs'));
    $('#tabRace').addEventListener('click', () => go('race'));
    $('#tabAdd').addEventListener('click', () => $('#fileInput').click());
    $('#backBtn').addEventListener('click', () => { if (S.cameFromList && history.length > 1) { S.cameFromList = false; history.back(); } else go('runs'); });
    $('#fileInput').addEventListener('change', (e) => { const f = e.target.files; if (f && f.length) importFiles(f); e.target.value = ''; });
    $('#backupInput').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) restoreBackup(f); e.target.value = ''; });
    // 데스크톱 드래그 앤 드롭
    window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drag'); });
    window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
    window.addEventListener('drop', (e) => { e.preventDefault(); document.body.classList.remove('drag'); if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });
    window.addEventListener('hashchange', route);
  }

  async function init() {
    bindShell();
    S.storageOK = await DB.open();
    try { const st = await DB.get('kv', 'settings'); if (st) S.settings = { ...DEFAULTS, ...st }; } catch (e) { /* noop */ }
    try { S.acts = await DB.all('acts'); } catch (e) { S.acts = []; }
    try { S.plan = (await DB.get('kv', 'plan')) || null; S.missions = (await DB.get('kv', 'missions')) || []; } catch (e) { /* noop */ }
    sortActs();
    route();
    handleShareInbox();
    setTimeout(() => fillWeather(null), 1500);
    if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost|^http:\/\/127\./.test(location.href) && !window.claude) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }
  window.RunLog = { S, importFiles, addSamples, route };
  init();
})();
</script>
</body>
</html>
