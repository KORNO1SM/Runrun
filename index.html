<script>/* 샘플 러닝 데이터 생성기 — 테스트 및 '샘플로 둘러보기'용 */
(function (root) {
  'use strict';

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(r) {
    let u = 0, v = 0;
    while (!u) u = r();
    while (!v) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function gapFactor(g) {
    const G = Math.max(-30, Math.min(30, g * 100));
    return (0.98462 + 0.030266 * G + 0.0018814 * G * G - 3.3882e-6 * G * G * G - 4.8169e-7 * G * G * G * G) / 0.98462;
  }
  const MLAT = 111320;
  function bump(x, c, w, h) { const u = Math.abs(x - c); return u < w ? h * 0.5 * (1 + Math.cos(Math.PI * u / w)) : 0; }

  // 경로: 거리 s(m) → {lat, lon, ele}
  function polylineRoute(pts) {
    // pts: [[east, north], ...] in meters
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { pts, cum, len: cum[cum.length - 1] };
  }
  function routeAt(rt, s) {
    s = Math.max(0, Math.min(rt.len, s));
    let lo = 0, hi = rt.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (rt.cum[m] <= s) lo = m; else hi = m; }
    const f = (s - rt.cum[lo]) / Math.max(1e-9, rt.cum[hi] - rt.cum[lo]);
    return [rt.pts[lo][0] + f * (rt.pts[hi][0] - rt.pts[lo][0]), rt.pts[lo][1] + f * (rt.pts[hi][1] - rt.pts[lo][1])];
  }

  function makeCourse(kind, total) {
    if (kind === 'loop') {
      const a = 1100, b = 480, rot = -0.45, pts = [];
      for (let i = 0; i <= 720; i++) {
        const th = (i / 720) * 2 * Math.PI;
        const x = a * Math.cos(th), y = b * Math.sin(th);
        pts.push([x * Math.cos(rot) - y * Math.sin(rot), x * Math.sin(rot) + y * Math.cos(rot)]);
      }
      const rt = polylineRoute(pts);
      const L = rt.len;
      return {
        origin: [37.5262, 126.9268],
        pos(s) { return routeAt(rt, s % L); },
        ele(s) { const x = s % L; return 13 + 2.2 * Math.sin(2 * Math.PI * x / L + 1) + bump(x, 0.62 * L, 260, 15); },
      };
    }
    // 강변 왕복 코스
    const half = total / 2 + 50, pts = [];
    const th = 0.18;
    for (let u = 0; u <= half; u += 25) {
      const e = u * Math.cos(th) + 45 * Math.sin(u / 900);
      const n = u * Math.sin(th) + 140 * Math.sin(u / 2600);
      pts.push([e, n]);
    }
    const rt = polylineRoute(pts);
    const prof = (x) => 9 + 1.5 * Math.sin(x / 1300) + bump(x, 3300, 330, 22) + bump(x, 8200, 260, 12) + bump(x, 14600, 300, 16);
    return {
      origin: kind === 'race' ? [37.5172, 126.8935] : [37.5296, 126.9090],
      pos(s) { const x = s <= total / 2 ? s : total - s; return routeAt(rt, x); },
      ele(s) { const x = s <= total / 2 ? s : total - s; return prof(x); },
    };
  }

  // 훈련 유형별 목표 속도(m/s)
  function planFn(type, total) {
    const sp = (secPerKm) => 1000 / secPerKm;
    switch (type) {
      case 'recovery': return () => sp(378);
      case 'easy': return () => sp(345);
      case 'long': return (s) => (s > total - 3000 ? sp(318) : sp(336));
      case 'tempo': return (s) => (s < 2000 ? sp(350) : s > total - 1500 ? sp(360) : sp(272));
      case 'interval': return (s) => {
        if (s < 2000) return sp(350);
        if (s > total - 1500) return sp(365);
        const x = (s - 2000) % 1200;
        return x < 800 ? sp(236) : sp(400);
      };
      case 'race': return (s) => sp(274 + (s > 15000 ? (s - 15000) / 1000 * 1.8 : 0));
      default: return () => sp(345);
    }
  }

  /**
   * 한 번의 러닝 시뮬레이션
   * opts: {type, dist(m), start(Date), seed, fitness(0..1), dt(s), course}
   */
  function simulate(opts) {
    const r = rng(opts.seed || 1);
    const type = opts.type || 'easy';
    const total = opts.dist || 8000;
    const dt = opts.dt || 1;
    const course = makeCourse(opts.course || (total > 12000 || type === 'race' ? 'river' : 'loop'), total);
    const plan = planFn(type, total);
    const rest = 50, max = 188;
    const fit = opts.fitness || 0;
    const t = [], lat = [], lon = [], ele = [], hr = [], cad = [];
    let s = 0, time = 0, h = rest + 25, nx = 0, ny = 0, stopLeft = 0, stopped = false;
    const stopAt = type === 'easy' || type === 'recovery' ? 2300 + r() * 1500 : -1;
    const cosLat = Math.cos(course.origin[0] * Math.PI / 180);
    let vPrev = plan(0);
    while (s < total) {
      let v;
      if (stopAt > 0 && !stopped && s >= stopAt) { stopped = true; stopLeft = 22 + Math.floor(r() * 12); }
      const g = (course.ele(s + 8) - course.ele(Math.max(0, s - 8))) / 16;
      if (stopLeft > 0) { v = 0; stopLeft -= dt; }
      else {
        const target = plan(s) / Math.pow(gapFactor(g), 0.72) * (1 + 0.012 * gauss(r));
        v = vPrev + (target - vPrev) * Math.min(1, dt / 6);
      }
      vPrev = Math.max(v, 0.5);
      s += v * dt; time += dt;
      const veq = v * gapFactor(g);
      let hrr = v < 0.3 ? 0.42 : 0.65 + (veq - 2.9) * 0.28;
      const drift = (type === 'race' ? 0.05 : 0.03) * (time / 3600);
      hrr = Math.max(0.25, Math.min(0.965, hrr + drift - 0.035 * fit));
      const target = rest + hrr * (max - rest);
      const tau = target > h ? 22 : 40;
      h += (target - h) * (1 - Math.exp(-dt / tau));
      const spm = v < 0.3 ? 0 : 163 + (v - 2.9) * 13 + (g > 0.03 ? 3 : 0) + 1.4 * gauss(r);
      nx = 0.9 * nx + 0.25 * gauss(r); ny = 0.9 * ny + 0.25 * gauss(r);
      const [e, n] = course.pos(Math.min(s, total));
      t.push(time);
      lat.push(course.origin[0] + (n + ny) / MLAT);
      lon.push(course.origin[1] + (e + nx) / (MLAT * cosLat));
      ele.push(course.ele(Math.min(s, total)) + 0.15 * gauss(r));
      hr.push(Math.round(h + 1.1 * gauss(r)));
      cad.push(spm ? Math.round(spm / 2) : 0); // GPX의 cad는 보통 한쪽 발 기준(rpm)
    }
    return { start: opts.start ? +opts.start : Date.now(), t, lat, lon, ele, hr, cad };
  }

  function toGPX(sim, name, ns) {
    ns = ns || 'gpxtpx';
    const nsUri = 'http://www.garmin.com/xmlschemas/TrackPointExtension/v1';
    const lines = [];
    lines.push('<?xml version="1.0" encoding="UTF-8"?>');
    lines.push(`<gpx creator="RunLog Test" version="1.1" xmlns="http://www.topografix.com/GPX/1/1" xmlns:${ns}="${nsUri}">`);
    lines.push(`<metadata><time>${new Date(sim.start).toISOString()}</time></metadata>`);
    lines.push(`<trk><name>${name}</name><type>running</type><trkseg>`);
    for (let i = 0; i < sim.t.length; i++) {
      const tm = new Date(sim.start + sim.t[i] * 1000).toISOString();
      lines.push(`<trkpt lat="${sim.lat[i].toFixed(7)}" lon="${sim.lon[i].toFixed(7)}"><ele>${sim.ele[i].toFixed(1)}</ele><time>${tm}</time><extensions><${ns}:TrackPointExtension><${ns}:hr>${sim.hr[i]}</${ns}:hr><${ns}:cad>${sim.cad[i]}</${ns}:cad></${ns}:TrackPointExtension></extensions></trkpt>`);
    }
    lines.push('</trkseg></trk></gpx>');
    return lines.join('\n');
  }

  // 최근 10주 훈련 블록 샘플 (주 4회 + 마지막 주 하프 레이스)
  function sampleSet(now, dt) {
    now = now ? new Date(now) : new Date();
    const out = [];
    const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const dow = (day0.getDay() + 6) % 7; // 월=0
    const thisMon = new Date(day0); thisMon.setDate(day0.getDate() - dow);
    const weeks = 10;
    let seed = 11;
    for (let w = weeks - 1; w >= 0; w--) {
      const mon = new Date(thisMon); mon.setDate(thisMon.getDate() - 7 * w);
      const fit = (weeks - 1 - w) / (weeks - 1);
      const raceWeek = w === 1;
      const plan = raceWeek
        ? [[1, 'easy', 7000, 6.5], [3, 'tempo', 8000, 6.3], [5, 'recovery', 4000, 7.5], [6, 'race', 21097.5, 7.0]]
        : [[1, 'easy', 7000 + 500 * (w % 3), 6.5], [3, w % 2 ? 'interval' : 'tempo', w % 2 ? 9400 : 9000, 6.3], [5, 'easy', 6000, 7.2], [6, 'long', 15000 + 1000 * Math.min(7, weeks - w), 7.0]];
      for (const [d, type, dist, hour] of plan) {
        const start = new Date(mon); start.setDate(mon.getDate() + d);
        start.setHours(Math.floor(hour), Math.round((hour % 1) * 60) + (seed % 13), 0, 0);
        if (start > now) continue;
        const sim = simulate({ type, dist, start, seed: seed++, fitness: fit, dt: dt || 2 });
        out.push({ type, sim, name: type === 'race' ? '하프 마라톤 (샘플)' : '' });
      }
    }
    return out;
  }

  const Gen = { simulate, toGPX, sampleSet, rng, gauss };
  root.Gen = Gen;
  if (typeof module !== 'undefined' && module.exports) module.exports = Gen;
})(typeof self !== 'undefined' ? self : this);
</script>
<script>/* RunLog 분석 엔진 — GPX/TCX 파싱, 스플릿, 경사 보정, 러닝 이코노미 */
(function (root) {
  'use strict';

  const R_EARTH = 6371008.8, RAD = Math.PI / 180;
  const MIN_MOVE_V = 0.8;      // m/s 미만이면 정지로 간주
  const GLITCH_V = 12;         // m/s 초과 구간은 GPS 튐으로 간주
  const ELE_WIN = 20;          // 고도 평활 반경(m)
  const GRADE_WIN = 30;        // 경사 계산 반경(m)
  const ELE_TH = 1.0;          // 상승/하강 누적 임계(m)

  function hav(a1, o1, a2, o2) {
    const dLat = (a2 - a1) * RAD, dLon = (o2 - o1) * RAD;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a1 * RAD) * Math.cos(a2 * RAD) * Math.sin(dLon / 2) ** 2;
    return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  const fin = Number.isFinite;
  function num(s) { if (s == null) return NaN; const v = parseFloat(s); return fin(v) ? v : NaN; }

  /* ───────── 경사 보정 계수 (Strava식 GAP 근사 다항식, G=경사%) ───────── */
  function gapFactor(g) {
    const G = Math.max(-30, Math.min(30, g * 100));
    return (0.98462 + 0.030266 * G + 0.0018814 * G * G - 3.3882e-6 * G * G * G - 4.8169e-7 * G * G * G * G) / 0.98462;
  }

  /* ───────── 파싱 ───────── */
  const HR_KEYS = new Set(['hr', 'heartrate', 'heart_rate', 'heartratebpm']);
  const CAD_KEYS = new Set(['cad', 'cadence', 'runcadence', 'run_cadence']);
  const PWR_KEYS = new Set(['power', 'watts', 'pwr']);

  function parseXML(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('XML 형식이 올바르지 않아요');
    return doc;
  }
  function childText(el, name) {
    for (const c of el.children) if (c.localName === name) return c.textContent.trim();
    return '';
  }

  function finishParse(rows, meta) {
    rows = rows.filter((r) => fin(r.time));
    if (rows.length < 10) throw new Error('시간 정보가 있는 기록 포인트가 부족해요 (경로 전용 GPX는 분석할 수 없어요)');
    rows.sort((a, b) => a.time - b.time);
    const dedup = [];
    for (const r of rows) {
      const last = dedup[dedup.length - 1];
      if (last && r.time - last.time < 1) continue; // 동일 시각 제거(1ms 해상도 이하)
      dedup.push(r);
    }
    const n = dedup.length, t0 = dedup[0].time;
    const raw = {
      t: new Float64Array(n), lat: new Float64Array(n), lon: new Float64Array(n),
      ele: new Float32Array(n), hr: new Float32Array(n), cad: new Float32Array(n), pwr: new Float32Array(n),
      dist: null,
    };
    const hasDist = dedup.filter((r) => fin(r.dist)).length > n * 0.5;
    if (hasDist) raw.dist = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const r = dedup[i];
      raw.t[i] = (r.time - t0) / 1000;
      raw.lat[i] = fin(r.lat) ? r.lat : NaN; raw.lon[i] = fin(r.lon) ? r.lon : NaN;
      raw.ele[i] = fin(r.ele) ? r.ele : NaN; raw.hr[i] = fin(r.hr) ? r.hr : NaN;
      raw.cad[i] = fin(r.cad) ? r.cad : NaN; raw.pwr[i] = fin(r.pwr) ? r.pwr : NaN;
      if (hasDist) raw.dist[i] = fin(r.dist) ? r.dist : NaN;
    }
    return { name: meta.name || '', sport: meta.sport || '', start: t0, raw };
  }

  function parseGPX(text) {
    const doc = parseXML(text);
    const pts = doc.getElementsByTagNameNS('*', 'trkpt');
    if (!pts.length) throw new Error('GPX에 트랙 포인트(trkpt)가 없어요');
    const trk = doc.getElementsByTagNameNS('*', 'trk')[0];
    let name = trk ? childText(trk, 'name') : '';
    const sport = trk ? childText(trk, 'type') : '';
    const rows = [];
    for (const p of pts) {
      const r = { lat: num(p.getAttribute('lat')), lon: num(p.getAttribute('lon')), time: NaN, ele: NaN, hr: NaN, cad: NaN, pwr: NaN };
      const all = p.getElementsByTagName('*');
      for (let k = 0; k < all.length; k++) {
        const el = all[k], ln = el.localName.toLowerCase();
        if (ln === 'time') r.time = Date.parse(el.textContent.trim());
        else if (ln === 'ele') r.ele = num(el.textContent);
        else if (HR_KEYS.has(ln)) r.hr = num(el.textContent);
        else if (CAD_KEYS.has(ln)) r.cad = num(el.textContent);
        else if (PWR_KEYS.has(ln)) r.pwr = num(el.textContent);
      }
      rows.push(r);
    }
    return finishParse(rows, { name, sport });
  }

  function parseTCX(text) {
    const doc = parseXML(text);
    const tps = doc.getElementsByTagNameNS('*', 'Trackpoint');
    if (!tps.length) throw new Error('TCX에 Trackpoint가 없어요');
    const act = doc.getElementsByTagNameNS('*', 'Activity')[0];
    const sport = act ? act.getAttribute('Sport') || '' : '';
    const rows = [];
    for (const tp of tps) {
      const r = { lat: NaN, lon: NaN, time: NaN, ele: NaN, hr: NaN, cad: NaN, pwr: NaN, dist: NaN };
      const all = tp.getElementsByTagName('*');
      for (let k = 0; k < all.length; k++) {
        const el = all[k], ln = el.localName.toLowerCase();
        if (ln === 'time') r.time = Date.parse(el.textContent.trim());
        else if (ln === 'latitudedegrees') r.lat = num(el.textContent);
        else if (ln === 'longitudedegrees') r.lon = num(el.textContent);
        else if (ln === 'altitudemeters') r.ele = num(el.textContent);
        else if (ln === 'distancemeters') r.dist = num(el.textContent);
        else if (ln === 'value' && el.parentElement && el.parentElement.localName.toLowerCase() === 'heartratebpm') r.hr = num(el.textContent);
        else if (ln === 'cadence' || ln === 'runcadence') r.cad = num(el.textContent);
        else if (ln === 'watts') r.pwr = num(el.textContent);
      }
      rows.push(r);
    }
    return finishParse(rows, { name: '', sport });
  }

  function parseFile(text) {
    const head = text.slice(0, 4000);
    if (/<TrainingCenterDatabase/i.test(head)) return parseTCX(text);
    if (/<gpx[\s>]/i.test(head) || /<trkpt/i.test(text.slice(0, 20000))) return parseGPX(text);
    throw new Error('GPX 또는 TCX 파일이 아니에요');
  }

  /* ───────── 보조 ───────── */
  // d(오름차순)에서 D 위치의 cumulative 배열 값을 선형 보간
  function makeAt(d) {
    const n = d.length;
    function idx(D) {
      if (D <= d[0]) return 0;
      if (D >= d[n - 1]) return n - 1;
      let lo = 0, hi = n - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (d[m] <= D) lo = m; else hi = m; }
      return lo;
    }
    function at(arr, D) {
      const i = idx(D);
      if (i >= n - 1) return arr[n - 1];
      const span = d[i + 1] - d[i];
      const f = span > 0 ? (D - d[i]) / span : 0;
      return arr[i] + f * (arr[i + 1] - arr[i]);
    }
    return { idx, at };
  }
  function median(a) {
    if (!a.length) return NaN;
    const s = Float64Array.from(a).sort();
    return s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
  }

  function zoneBounds(set) {
    const max = set.hrMax, rest = set.hrRest;
    const pcts = [0.6, 0.7, 0.8, 0.9];
    return set.zoneMethod === 'max' ? pcts.map((p) => p * max) : pcts.map((p) => rest + p * (max - rest));
  }

  /* ───────── 전처리: 누적 배열 구성 ───────── */
  function prepare(raw, set) {
    const n = raw.t.length, t = raw.t;
    const d = new Float64Array(n);
    let gpsCount = 0;
    for (let i = 0; i < n; i++) if (fin(raw.lat[i]) && fin(raw.lon[i])) gpsCount++;
    const hasGPS = gpsCount > n * 0.5;
    const devDist = raw.dist && Array.prototype.filter.call(raw.dist, fin).length > n * 0.5;

    if (devDist) {
      let last = 0;
      for (let i = 0; i < n; i++) { const v = raw.dist[i]; if (fin(v) && v >= last) last = v; d[i] = last; }
      const off = d[0];
      for (let i = 0; i < n; i++) d[i] -= off;
    } else if (hasGPS) {
      let pl = NaN, po = NaN;
      for (let i = 0; i < n; i++) {
        const la = raw.lat[i], lo = raw.lon[i];
        let seg = 0;
        if (fin(la) && fin(lo)) {
          if (fin(pl)) {
            seg = hav(pl, po, la, lo);
            const dt = i > 0 ? t[i] - t[i - 1] : 1;
            if (dt > 0 && seg / dt > GLITCH_V && dt < 30) seg = 0;
          }
          pl = la; po = lo;
        }
        d[i] = (i ? d[i - 1] : 0) + seg;
      }
    }

    // 이동 판정(구간 i-1→i), 이동시간 누적
    const mv = new Uint8Array(n), mt = new Float64Array(n);
    for (let i = 1; i < n; i++) {
      const a = Math.max(0, i - 3), b = Math.min(n - 1, i + 2);
      const dtw = t[b] - t[a], ddw = d[b] - d[a];
      const dt = t[i] - t[i - 1], dd = d[i] - d[i - 1];
      const vw = dtw > 0 ? ddw / dtw : 0, vs = dt > 0 ? dd / dt : 0;
      let moving = dt > 0 && (dt > 15 ? vs >= 1.2 : vw >= MIN_MOVE_V);
      // 케이던스 0이 기록됐으면(워치가 정지로 인식) 정지로 처리 — 단, 빠르게 이동 중이면 센서 누락으로 보고 무시
      if (moving && raw.cad[i] === 0 && raw.cad[i - 1] === 0 && vw < 2.0) moving = false;
      mv[i] = moving ? 1 : 0;
      mt[i] = mt[i - 1] + (moving ? dt : 0);
    }

    // 고도: 보간 → 거리 기반 평활
    let eleCount = 0;
    for (let i = 0; i < n; i++) if (fin(raw.ele[i])) eleCount++;
    const hasEle = eleCount > n * 0.5 && (hasGPS || devDist);
    const eleS = new Float64Array(n), grade = new Float64Array(n), gainC = new Float64Array(n), lossC = new Float64Array(n);
    if (hasEle) {
      const ef = new Float64Array(n);
      let lastI = -1;
      for (let i = 0; i < n; i++) {
        if (fin(raw.ele[i])) {
          if (lastI < 0) for (let k = 0; k < i; k++) ef[k] = raw.ele[i];
          else for (let k = lastI + 1; k < i; k++) ef[k] = raw.ele[lastI] + (raw.ele[i] - raw.ele[lastI]) * (k - lastI) / (i - lastI);
          ef[i] = raw.ele[i]; lastI = i;
        }
      }
      for (let k = lastI + 1; k < n; k++) ef[k] = raw.ele[lastI];
      const pre = new Float64Array(n + 1);
      for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + ef[i];
      let lo = 0, hi = 0;
      for (let i = 0; i < n; i++) {
        while (d[i] - d[lo] > ELE_WIN) lo++;
        if (hi < i) hi = i;
        while (hi + 1 < n && d[hi + 1] - d[i] <= ELE_WIN) hi++;
        eleS[i] = (pre[hi + 1] - pre[lo]) / (hi - lo + 1);
      }
      let anchor = eleS[0], gain = 0, loss = 0;
      for (let i = 0; i < n; i++) {
        const diff = eleS[i] - anchor;
        if (diff >= ELE_TH) { gain += diff; anchor = eleS[i]; }
        else if (diff <= -ELE_TH) { loss -= diff; anchor = eleS[i]; }
        gainC[i] = gain; lossC[i] = loss;
      }
      lo = 0; hi = 0;
      for (let i = 0; i < n; i++) {
        while (d[i] - d[lo] > GRADE_WIN) lo++;
        if (hi < i) hi = i;
        while (hi + 1 < n && d[hi + 1] - d[i] <= GRADE_WIN) hi++;
        const span = d[hi] - d[lo];
        grade[i] = span >= 20 ? Math.max(-0.3, Math.min(0.3, (eleS[hi] - eleS[lo]) / span)) : 0;
      }
    }

    // 심박: 짧은 결측(≤10초) 보정
    const hr = new Float64Array(n);
    let hrCount = 0, lastHr = NaN, lastHrT = -1e9;
    for (let i = 0; i < n; i++) {
      const v = raw.hr[i];
      if (fin(v) && v >= 35 && v <= 230) { hr[i] = v; lastHr = v; lastHrT = t[i]; hrCount++; }
      else hr[i] = t[i] - lastHrT <= 10 ? lastHr : NaN;
    }
    const hasHR = hrCount > n * 0.3;

    // 케이던스: 한쪽 발 기준이면 ×2
    let cadFactor = 1;
    const cadVals = [];
    for (let i = 1; i < n; i++) if (mv[i] && fin(raw.cad[i]) && raw.cad[i] > 30) cadVals.push(raw.cad[i]);
    const hasCad = cadVals.length > n * 0.3;
    if (set.cadMode === 'x2') cadFactor = 2;
    else if (set.cadMode === 'x1') cadFactor = 1;
    else cadFactor = hasCad && median(cadVals) < 120 ? 2 : 1;

    // 누적 배열
    const eq = new Float64Array(n), B = new Float64Array(n), HT = new Float64Array(n), EQH = new Float64Array(n), DH = new Float64Array(n);
    const S = new Float64Array(n), CT = new Float64Array(n), P = new Float64Array(n), PT = new Float64Array(n);
    const zb = zoneBounds(set);
    const zones = [0, 0, 0, 0, 0];
    let trimp = 0, maxHR = 0, pwrCount = 0;
    const kA = set.sex === 'f' ? 0.86 : 0.64, kB = set.sex === 'f' ? 1.67 : 1.92;
    for (let i = 1; i < n; i++) {
      const dt = t[i] - t[i - 1], dd = d[i] - d[i - 1];
      const gf = hasEle ? gapFactor((grade[i] + grade[i - 1]) / 2) : 1;
      eq[i] = eq[i - 1] + dd * gf;
      B[i] = B[i - 1]; HT[i] = HT[i - 1]; EQH[i] = EQH[i - 1]; DH[i] = DH[i - 1];
      S[i] = S[i - 1]; CT[i] = CT[i - 1]; P[i] = P[i - 1]; PT[i] = PT[i - 1];
      if (!mv[i]) continue;
      const h = (hr[i] + hr[i - 1]) / 2;
      if (fin(h)) {
        B[i] += h * dt / 60; HT[i] += dt; EQH[i] += dd * gf; DH[i] += dd;
        let z = 0; while (z < 4 && h >= zb[z]) z++;
        zones[z] += dt;
        const x = Math.max(0, Math.min(1, (h - set.hrRest) / (set.hrMax - set.hrRest)));
        trimp += (dt / 60) * x * kA * Math.exp(kB * x);
      }
      const c = raw.cad[i] * cadFactor;
      if (fin(c) && c >= 100 && c <= 260) { S[i] += c * dt / 60; CT[i] += dt; }
      const p = raw.pwr[i];
      if (fin(p) && p > 0) { P[i] += p * dt; PT[i] += dt; pwrCount++; }
    }
    // 최대 심박(3점 중앙값으로 스파이크 제거)
    for (let i = 1; i < n - 1; i++) {
      const a = hr[i - 1], b = hr[i], c = hr[i + 1];
      if (fin(a) && fin(b) && fin(c)) { const m = Math.max(Math.min(a, b), Math.min(Math.max(a, b), c)); if (m > maxHR) maxHR = m; }
    }

    return {
      n, t, d, mv, mt, eq, B, HT, EQH, DH, S, CT, P, PT, eleS, grade, gainC, lossC, hr,
      hasGPS, hasEle, hasHR, hasCad, hasPwr: pwrCount > n * 0.3, cadFactor, zones, trimp, maxHR,
      lat: raw.lat, lon: raw.lon, total: d[n - 1], ...makeAt(d),
    };
  }

  function rangeStats(P, a, b) {
    const at = P.at;
    const time = at(P.mt, b) - at(P.mt, a), dist = b - a;
    const eqd = at(P.eq, b) - at(P.eq, a);
    const beats = at(P.B, b) - at(P.B, a), ht = at(P.HT, b) - at(P.HT, a);
    const steps = at(P.S, b) - at(P.S, a), ct = at(P.CT, b) - at(P.CT, a);
    const eqh = at(P.EQH, b) - at(P.EQH, a);
    const pw = at(P.P, b) - at(P.P, a), pt = at(P.PT, b) - at(P.PT, a);
    const pace = dist > 0 && time > 0 ? time / dist * 1000 : NaN;
    const cad = ct > 3 ? steps / ct * 60 : NaN;
    return {
      dist, time, pace,
      gap: eqd > 0 && time > 0 ? time / eqd * 1000 : NaN,
      hr: ht > 3 ? beats / ht * 60 : NaN,
      cad,
      stride: fin(cad) && fin(pace) ? (1000 / pace) / (cad / 60) : NaN,
      gain: P.hasEle ? at(P.gainC, b) - at(P.gainC, a) : NaN,
      loss: P.hasEle ? at(P.lossC, b) - at(P.lossC, a) : NaN,
      ef: beats > 10 ? eqh / beats : NaN,
      pwr: pt > 3 ? pw / pt : NaN,
    };
  }

  function bestEfforts(P) {
    const out = {};
    const targets = [1000, 5000, 10000, 21097.5, 42195];
    const { d, mt, n } = P;
    for (const D of targets) {
      if (P.total < D * 0.995) continue;
      let best = Infinity, j = 0;
      for (let i = 0; i < n; i++) {
        const end = d[i] + D;
        if (end > P.total) break;
        while (j < n - 1 && d[j + 1] < end) j++;
        const span = d[j + 1] - d[j];
        const tEnd = span > 0 ? mt[j] + (end - d[j]) / span * (mt[j + 1] - mt[j]) : mt[j];
        const dur = tEnd - mt[i];
        if (dur > 0 && dur < best) best = dur;
      }
      if (P.total < D) best = best === Infinity ? mt[n - 1] * D / P.total : best;
      if (fin(best)) out[D] = Math.round(best);
    }
    return out;
  }

  // 업힐/다운힐 구간 탐지 (20m 리샘플 고도 프로파일)
  function findHills(P) {
    if (!P.hasEle || P.total < 300) return { climbs: [], descents: [] };
    const step = 20, m = Math.floor(P.total / step) + 1;
    const E = new Float64Array(m);
    for (let k = 0; k < m; k++) E[k] = P.at(P.eleS, k * step);
    function scan(sign) {
      const res = [];
      let L = 0, H = 0;
      const val = (k) => sign * E[k];
      const fin_ = (Li, Hi) => {
        // 완만한 시작·끝부분은 잘라내고 실제 경사 구간만 남김
        while (Hi - Li > 3 && (val(Li + 3) - val(Li)) / (3 * step) < 0.01) Li++;
        while (Hi - Li > 3 && (val(Hi) - val(Hi - 3)) / (3 * step) < 0.01) Hi--;
        const gain = val(Hi) - val(Li), len = (Hi - Li) * step;
        if (gain >= 8 && len >= 120 && gain / len >= 0.015) res.push({ a: Li * step, b: Hi * step, gain, grade: gain / len });
      };
      for (let k = 1; k < m; k++) {
        const v = val(k);
        if (v > val(H)) H = k;
        else if (val(H) - v > 3) { fin_(L, H); L = H = k; }
        else if (v < val(L)) { L = H = k; }
      }
      fin_(L, H);
      return res.map((h) => ({ ...h, ...pick(rangeStats(P, h.a, h.b), ['pace', 'gap', 'hr', 'cad', 'time']) }));
    }
    return { climbs: scan(1), descents: scan(-1) };
  }
  function pick(o, keys) { const r = {}; for (const k of keys) r[k] = o[k]; return r; }

  /* ───────── 메인 분석 ───────── */
  function analyze(raw, set, opts) {
    opts = opts || {};
    const P = prepare(raw, set);
    const total = P.total, n = P.n;
    const all = rangeStats(P, 0, total);
    const moving = P.mt[n - 1];
    const elapsed = P.t[n - 1] - P.t[0];

    // 페이스 변동성(200m 구간 속도의 변동계수) — 인터벌 판별용
    let cv = NaN;
    if (total >= 1000) {
      const sp = [];
      for (let a = 0; a + 200 <= total; a += 200) { const r = rangeStats(P, a, a + 200); if (r.time > 0) sp.push(200 / r.time); }
      if (sp.length > 3) {
        const mean = sp.reduce((x, y) => x + y, 0) / sp.length;
        cv = Math.sqrt(sp.reduce((x, y) => x + (y - mean) ** 2, 0) / sp.length) / mean;
      }
    }

    // 디커플링(전·후반 EF 비교, 경사 보정)
    let dec = NaN, ef1 = NaN, ef2 = NaN;
    if (P.hasHR && moving >= 1200 && P.HT[n - 1] / moving > 0.8) {
      const half = moving / 2;
      let lo = 0, hi = n - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P.mt[m] <= half) lo = m; else hi = m; }
      const Dh = P.d[lo];
      ef1 = rangeStats(P, 0, Dh).ef; ef2 = rangeStats(P, Dh, total).ef;
      if (fin(ef1) && fin(ef2)) dec = (ef1 - ef2) / ef1 * 100;
    }

    const hrr = P.hasHR ? (all.hr - set.hrRest) / (set.hrMax - set.hrRest) : NaN;
    const summary = {
      dist: total, moving, elapsed,
      pace: all.pace, gap: P.hasEle ? all.gap : NaN,
      avgHR: P.hasHR ? all.hr : NaN, maxHR: P.hasHR ? P.maxHR : NaN, hrr,
      avgCad: P.hasCad ? all.cad : NaN, stride: P.hasCad ? all.stride : NaN,
      gain: P.hasEle ? P.gainC[n - 1] : NaN, loss: P.hasEle ? P.lossC[n - 1] : NaN,
      ef: P.hasHR ? all.ef : NaN,
      efRaw: P.hasHR && P.B[n - 1] > 0 ? P.DH[n - 1] / P.B[n - 1] : NaN,
      dec, ef1, ef2, cv,
      trimp: P.hasHR ? P.trimp : NaN,
      zones: P.hasHR ? P.zones.map(Math.round) : null,
      avgPwr: P.hasPwr ? all.pwr : NaN,
      best: bestEfforts(P),
      hasGPS: P.hasGPS, hasEle: P.hasEle, hasHR: P.hasHR, hasCad: P.hasCad, hasPwr: P.hasPwr,
      cadFactor: P.cadFactor,
    };
    if (opts.summaryOnly) return { summary, P };

    // 1km 스플릿
    const splits = [];
    for (let k = 0; k * 1000 < total; k++) {
      const a = k * 1000, b = Math.min(total, a + 1000);
      if (b - a < 50 && k > 0) break;
      splits.push({ k: k + 1, ...rangeStats(P, a, b) });
    }

    // 차트용 시리즈 (거리 기준 리샘플)
    const N = Math.max(40, Math.min(600, Math.round(total / 12)));
    const step = total / N, W = Math.max(50, Math.min(120, total / 200));
    const S = { x: [], pace: [], gap: [], hr: [], cad: [], ele: [], grade: [], stride: [] };
    for (let k = 0; k <= N; k++) {
      const x = k * step;
      const a = Math.max(0, x - W), b = Math.min(total, x + W);
      const r = rangeStats(P, a, b);
      const ok = fin(r.pace) && r.pace < 1200;
      S.x.push(x / 1000);
      S.pace.push(ok ? r.pace : null);
      S.gap.push(ok && P.hasEle && fin(r.gap) ? r.gap : null);
      S.hr.push(P.hasHR && fin(r.hr) ? r.hr : null);
      S.cad.push(P.hasCad && fin(r.cad) ? r.cad : null);
      S.stride.push(P.hasCad && fin(r.stride) && ok ? r.stride : null);
      S.ele.push(P.hasEle ? P.at(P.eleS, x) : null);
      S.grade.push(P.hasEle ? P.at(P.grade, x) * 100 : null);
    }

    // 지도용 트랙 (거리 간격 축소)
    const track = { lat: [], lon: [], d: [] };
    if (P.hasGPS) {
      const gap = Math.max(4, total / 1500);
      let lastD = -Infinity;
      for (let i = 0; i < n; i++) {
        if (!fin(P.lat[i]) || !fin(P.lon[i])) continue;
        if (P.d[i] - lastD >= gap || i === n - 1) { track.lat.push(P.lat[i]); track.lon.push(P.lon[i]); track.d.push(P.d[i]); lastD = P.d[i]; }
      }
    }
    const kmMarks = [];
    if (P.hasGPS) {
      for (let D = 1000; D < total; D += 1000) {
        const i = P.idx(D);
        if (fin(P.lat[i])) kmMarks.push({ km: D / 1000, lat: P.lat[i], lon: P.lon[i] });
      }
    }

    const hills = findHills(P);
    return { summary, splits, series: S, track, kmMarks, hills, P };
  }

  // 목록 썸네일용 경로(최대 64점)
  function thumb(raw) {
    const pts = [];
    const n = raw.t.length, stepI = Math.max(1, Math.floor(n / 64));
    for (let i = 0; i < n; i += stepI) if (fin(raw.lat[i]) && fin(raw.lon[i])) pts.push([+raw.lat[i].toFixed(5), +raw.lon[i].toFixed(5)]);
    return pts;
  }

  /* ───────── 훈련 유형 자동 추정 ───────── */
  function guessType(sm, name, set) {
    if (/마라톤|대회|레이스|race|marathon|10k|하프/i.test(name || '')) return 'race';
    const km = sm.dist / 1000;
    if (fin(sm.cv) && sm.cv > 0.16 && km >= 3) return 'interval';
    const zt = sm.zones ? sm.zones.reduce((a, b) => a + b, 0) : 0;
    const hard = zt > 0 ? (sm.zones[3] + sm.zones[4]) / zt : NaN;
    if (fin(hard) && hard >= 0.75 && km >= 9.8) return 'race';
    if (fin(hard) && hard >= 0.25) return 'tempo';
    if (km >= 16) return 'long';
    if (fin(sm.hrr)) {
      if (sm.hrr < 0.6 && km < 8) return 'recovery';
      if (sm.hrr >= 0.8) return 'tempo';
      return 'easy';
    }
    return 'easy';
  }

  /* ───────── 인사이트 문장 ───────── */
  const fmtPace = (s) => { if (!fin(s)) return '–'; s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  function insights(A, ctx) {
    const sm = A.summary, out = [];
    ctx = ctx || {};
    // 페이스 전략
    if (sm.dist >= 4000) {
      const h = sm.dist / 2;
      const r1 = rangeStats(A.P, 0, h), r2 = rangeStats(A.P, h, sm.dist);
      const diff = r2.pace - r1.pace;
      if (fin(diff)) {
        if (diff <= -3) out.push({ k: 'good', t: `네거티브 스플릿: 후반이 전반보다 km당 ${Math.round(-diff)}초 빨랐어요 (${fmtPace(r1.pace)} → ${fmtPace(r2.pace)})` });
        else if (diff >= 8) out.push({ k: 'warn', t: `후반에 km당 ${Math.round(diff)}초 느려졌어요 (${fmtPace(r1.pace)} → ${fmtPace(r2.pace)})` });
        else out.push({ k: 'info', t: `전·후반 페이스가 고르게 유지됐어요 (${fmtPace(r1.pace)} / ${fmtPace(r2.pace)})` });
      }
    }
    // 디커플링
    if (fin(sm.dec) && ctx.type !== 'interval') {
      const v = sm.dec.toFixed(1);
      if (sm.dec < 5) out.push({ k: 'good', t: `심박-페이스 디커플링 ${v}% — 5% 미만이라 이 강도에서 유산소 지구력이 안정적이에요` });
      else if (sm.dec < 10) out.push({ k: 'warn', t: `디커플링 ${v}% — 후반 심박 드리프트가 있었어요. 수분·기온·피로 영향도 함께 보세요` });
      else out.push({ k: 'bad', t: `디커플링 ${v}% — 후반 효율이 크게 떨어졌어요. 이 강도·거리는 아직 버거운 편이에요` });
    }
    // 업힐/다운힐
    const { climbs, descents } = A.hills;
    const topC = climbs.slice().sort((a, b) => b.gain - a.gain).slice(0, 2);
    for (const c of topC) {
      out.push({ k: 'hill', t: `업힐 ${(c.a / 1000).toFixed(1)}–${(c.b / 1000).toFixed(1)}km: +${Math.round(c.gain)}m (평균 ${(c.grade * 100).toFixed(1)}%) · 페이스 ${fmtPace(c.pace)} → 경사 보정 ${fmtPace(c.gap)}${fin(c.hr) ? ` · 심박 ${Math.round(c.hr)}` : ''}` });
    }
    const topD = descents.slice().sort((a, b) => b.gain - a.gain).slice(0, 1);
    for (const c of topD) {
      out.push({ k: 'hill', t: `다운힐 ${(c.a / 1000).toFixed(1)}–${(c.b / 1000).toFixed(1)}km: −${Math.round(c.gain)}m (평균 −${(c.grade * 100).toFixed(1)}%) · 페이스 ${fmtPace(c.pace)} → 경사 보정 ${fmtPace(c.gap)}` });
    }
    // 가장 빠른/느린 km
    const full = A.splits.filter((s) => s.dist >= 990 && fin(s.pace));
    if (full.length >= 3) {
      const fast = full.reduce((a, b) => (b.pace < a.pace ? b : a));
      const slow = full.reduce((a, b) => (b.pace > a.pace ? b : a));
      out.push({ k: 'info', t: `가장 빠른 구간 ${fast.k}km ${fmtPace(fast.pace)}, 가장 느린 구간 ${slow.k}km ${fmtPace(slow.pace)}${fin(slow.gain) && slow.gain >= 8 ? ` (오르막 +${Math.round(slow.gain)}m 포함)` : ''}` });
    }
    // EF 비교
    if (fin(sm.ef) && fin(ctx.efAvg) && ctx.efN >= 3) {
      const p = (sm.ef / ctx.efAvg - 1) * 100;
      const label = ctx.typeLabel || '같은 유형';
      if (Math.abs(p) < 2) out.push({ k: 'info', t: `심박 효율(EF)이 최근 ${label} 평균과 비슷해요 (${sm.ef.toFixed(2)} m/beat)` });
      else out.push({ k: p > 0 ? 'good' : 'warn', t: `심박 효율(EF)이 최근 ${label} 평균보다 ${Math.abs(p).toFixed(1)}% ${p > 0 ? '좋아요' : '낮아요'} (${sm.ef.toFixed(2)} vs ${ctx.efAvg.toFixed(2)} m/beat)` });
    }
    // 케이던스-페이스 관계
    if (A.splits.length >= 4 && fin(sm.avgCad)) {
      const xs = [], ys = [];
      for (const s of full) if (fin(s.cad) && fin(s.stride)) { xs.push(1000 / s.pace); ys.push(s); }
      if (xs.length >= 4) {
        const fastest = ys.reduce((a, b) => (b.pace < a.pace ? b : a)), slowest = ys.reduce((a, b) => (b.pace > a.pace ? b : a));
        const dCad = fastest.cad - slowest.cad, dStr = fastest.stride - slowest.stride;
        if (fastest.pace < slowest.pace - 10) {
          const share = (dStr / slowest.stride) / ((dStr / slowest.stride) + (dCad / slowest.cad) || 1);
          out.push({ k: 'info', t: `빠른 구간에서 케이던스 ${dCad >= 0 ? '+' : ''}${Math.round(dCad)}spm, 보폭 ${dStr >= 0 ? '+' : ''}${Math.round(dStr * 100)}cm — 속도 증가는 주로 ${share > 0.5 ? '보폭' : '케이던스'}에서 나왔어요` });
        }
      }
    }
    return out;
  }

  const Engine = { parseFile, parseGPX, parseTCX, analyze, rangeStats, thumb, guessType, insights, gapFactor, zoneBounds, hav };
  root.Engine = Engine;
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
})(typeof self !== 'undefined' ? self : this);
</script>
<script>/* RunLog 캔버스 차트 — 라인(거리축), 막대(기간), 시간축 추세 */
(function (root) {
  'use strict';
  const fin = Number.isFinite;
  const C = {
    surface: '#1A1F28', text: '#EEF2F7', text2: '#B9C2D0', muted: '#7F8A9C', grid: '#262D38', axis: '#364050',
  };
  const FONT = '500 11px "Barlow Condensed", system-ui, -apple-system, sans-serif';

  function setup(el, height) {
    const c = document.createElement('canvas');
    c.className = 'chart-canvas';
    el.appendChild(c);
    const ctx = c.getContext('2d');
    function size() {
      const w = Math.max(120, el.clientWidth);
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      c.width = Math.round(w * dpr); c.height = Math.round(height * dpr);
      c.style.width = w + 'px'; c.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return w;
    }
    return { c, ctx, size };
  }

  function niceTicks(lo, hi, count, steps) {
    const raw = (hi - lo) / Math.max(1, count);
    if (!(raw > 0)) return [lo];
    let step;
    if (steps) step = steps.find((s) => s >= raw) || steps[steps.length - 1];
    else {
      const p = Math.pow(10, Math.floor(Math.log10(raw)));
      const f = raw / p;
      step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
    }
    const out = [];
    for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }

  function robustDomain(vals, o) {
    if (!vals.length) return null;
    vals.sort((a, b) => a - b);
    let lo, hi;
    if (o.robust === false) { lo = vals[0]; hi = vals[vals.length - 1]; }
    else { lo = vals[Math.floor(vals.length * 0.02)]; hi = vals[Math.max(0, Math.ceil(vals.length * 0.98) - 1)]; }
    if (o.zero) lo = Math.min(0, lo);
    let r = hi - lo;
    const minR = o.minRange || 1;
    if (r < minR) { const m = (hi + lo) / 2; lo = m - minR / 2; hi = m + minR / 2; r = minR; if (o.zero) { lo = Math.max(0, lo); } }
    const padLo = o.zero && lo === 0 ? 0 : r * 0.12;
    return { lo: lo - padLo, hi: hi + r * 0.12 };
  }

  function roundRectTop(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }
  function dot(ctx, x, y, r, color) {
    ctx.beginPath(); ctx.arc(x, y, r + 2, 0, Math.PI * 2); ctx.fillStyle = C.surface; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  }

  /**
   * 거리축 라인 차트
   * o: {x:[km], series:[{y, color, area}], height, invert, tickFmt, tickSteps, minRange, onScrub(i), zero}
   */
  function line(el, o) {
    const H = o.height || 130;
    const { c, ctx, size } = setup(el, H);
    const PAD = { l: 42, r: 10, t: 10, b: 22 };
    const x = o.x, n = x.length;
    const vals = [];
    for (const s of o.series) for (const v of s.y) if (v != null && fin(v)) vals.push(v);
    const dom = robustDomain(vals, o);
    let cursor = -1, W = 0;
    const x0 = x[0], x1 = x[n - 1];
    const X = (v) => PAD.l + ((v - x0) / (x1 - x0 || 1)) * (W - PAD.l - PAD.r);
    const Y = (v) => {
      const f = (v - dom.lo) / (dom.hi - dom.lo);
      return PAD.t + (o.invert ? f : 1 - f) * (H - PAD.t - PAD.b);
    };
    const clamp = (v) => Math.max(dom.lo, Math.min(dom.hi, v));

    function draw() {
      W = size();
      ctx.clearRect(0, 0, W, H);
      if (!dom) return;
      ctx.font = FONT;
      // y grid
      const yt = niceTicks(dom.lo, dom.hi, 3, o.tickSteps);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (const tv of yt) {
        const y = Math.round(Y(tv)) + 0.5;
        if (y < PAD.t - 2 || y > H - PAD.b + 2) continue;
        ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
        ctx.fillStyle = C.muted; ctx.fillText(o.tickFmt ? o.tickFmt(tv) : String(tv), PAD.l - 6, y);
      }
      // x axis
      ctx.strokeStyle = C.axis;
      ctx.beginPath(); ctx.moveTo(PAD.l, H - PAD.b + 0.5); ctx.lineTo(W - PAD.r, H - PAD.b + 0.5); ctx.stroke();
      const xt = niceTicks(x0, x1, Math.max(2, Math.floor((W - PAD.l) / 56)));
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = C.muted;
      for (const v of xt) {
        const px = X(v);
        if (px < PAD.l + 6 || px > W - PAD.r - 4) continue;
        ctx.fillText(+v.toFixed(2) + (v === xt[xt.length - 1] && px > W - 60 ? '' : ''), px, H - PAD.b + 6);
      }
      ctx.textAlign = 'left'; ctx.fillText('km', PAD.l - 20, H - PAD.b + 6);
      // series
      for (const s of o.series) {
        if (s.area) {
          ctx.beginPath();
          let started = false, lastX = 0, firstX = 0;
          const base = o.invert ? PAD.t : H - PAD.b;
          const baseY = H - PAD.b;
          for (let i = 0; i < n; i++) {
            const v = s.y[i]; if (v == null) continue;
            const px = X(x[i]), py = Y(clamp(v));
            if (!started) { ctx.moveTo(px, baseY); ctx.lineTo(px, py); firstX = px; started = true; } else ctx.lineTo(px, py);
            lastX = px;
          }
          if (started) { ctx.lineTo(lastX, baseY); ctx.lineTo(firstX, baseY); ctx.closePath(); ctx.fillStyle = hexA(s.color, 0.12); ctx.fill(); }
          void base;
        }
        ctx.strokeStyle = s.color; ctx.lineWidth = s.width || 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.beginPath();
        let pen = false;
        for (let i = 0; i < n; i++) {
          const v = s.y[i];
          if (v == null) { pen = false; continue; }
          const px = X(x[i]), py = Y(clamp(v));
          if (pen) ctx.lineTo(px, py); else { ctx.moveTo(px, py); pen = true; }
        }
        ctx.stroke();
      }
      if (cursor >= 0 && cursor < n) {
        const px = Math.round(X(x[cursor])) + 0.5;
        ctx.strokeStyle = C.text2; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px, PAD.t - 4); ctx.lineTo(px, H - PAD.b); ctx.stroke();
        for (const s of o.series) {
          const v = s.y[cursor];
          if (v != null) dot(ctx, px, Y(clamp(v)), 4, s.color);
        }
      }
    }
    function idxAt(clientX) {
      const r = c.getBoundingClientRect();
      const f = (clientX - r.left - PAD.l) / (r.width - PAD.l - PAD.r);
      const xv = x0 + Math.max(0, Math.min(1, f)) * (x1 - x0);
      let lo = 0, hi = n - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (x[m] <= xv) lo = m; else hi = m; }
      return xv - x[lo] < x[hi] - xv ? lo : hi;
    }
    c.style.touchAction = 'pan-y';
    c.addEventListener('pointerdown', (e) => o.onScrub && o.onScrub(idxAt(e.clientX)));
    c.addEventListener('pointermove', (e) => {
      if (!o.onScrub) return;
      if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) o.onScrub(idxAt(e.clientX));
    });
    if (!dom) { el.classList.add('chart-empty'); }
    draw();
    return { draw, setCursor(i) { cursor = i; draw(); } };
  }

  /**
   * 막대 차트(기간별)
   * o: {labels:[], values:[], sel, onSelect(i), tickFmt, height, goal, color, selColor, valueFmt}
   */
  function bars(el, o) {
    const H = o.height || 170;
    const { c, ctx, size } = setup(el, H);
    const PAD = { l: 34, r: 8, t: 22, b: 22 };
    const n = o.values.length;
    let W = 0, sel = o.sel;
    const maxV = Math.max(1, ...o.values, o.goal || 0);
    const ticks = niceTicks(0, maxV * 1.08, 3);
    const top = Math.max(maxV * 1.08, ticks[ticks.length - 1]);
    function geom() {
      const slot = (W - PAD.l - PAD.r) / n;
      const bw = Math.max(3, Math.min(24, slot * 0.62));
      return { slot, bw };
    }
    const Y = (v) => PAD.t + (1 - v / top) * (H - PAD.t - PAD.b);
    function draw() {
      W = size();
      ctx.clearRect(0, 0, W, H);
      ctx.font = FONT;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      const goalY = o.goal ? Y(o.goal) : -999;
      for (const tv of ticks) {
        const y = Math.round(Y(tv)) + 0.5;
        ctx.strokeStyle = tv === 0 ? C.axis : C.grid; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
        if (Math.abs(y - goalY) < 12) continue;
        ctx.fillStyle = C.muted; ctx.fillText(o.tickFmt ? o.tickFmt(tv) : String(tv), PAD.l - 6, y);
      }
      const { slot, bw } = geom();
      const every = Math.max(1, Math.ceil(30 / slot));
      for (let i = 0; i < n; i++) {
        const cx = PAD.l + slot * (i + 0.5);
        const v = o.values[i];
        if (v > 0) {
          const y = Y(v), h = H - PAD.b - y;
          roundRectTop(ctx, cx - bw / 2, y, bw, Math.max(1, h), h > 4 ? 4 : 1);
          ctx.fillStyle = i === sel ? (o.selColor || '#F2B84B') : (o.color || '#2a78d6');
          ctx.fill();
        }
        if (i === sel) {
          ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.font = '600 13px "Barlow Condensed", system-ui, -apple-system, sans-serif';
          const label = o.valueFmt ? o.valueFmt(v) : String(v);
          const lx = Math.max(PAD.l + 14, Math.min(W - 16, cx));
          ctx.fillText(label, lx, (v > 0 ? Y(v) : H - PAD.b) - 4);
          ctx.font = FONT;
        }
        const showLabel = i === sel || ((n - 1 - i) % every === 0 && Math.abs(i - sel) >= every * 0.75);
        if (showLabel) {
          ctx.fillStyle = i === sel ? C.text : C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText(o.labels[i], cx, H - PAD.b + 6);
        }
      }
      if (o.goal) {
        const y = Math.round(goalY) + 0.5;
        ctx.strokeStyle = 'rgba(242,184,75,.75)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
        ctx.fillStyle = '#F2B84B'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.font = '600 11px "IBM Plex Sans KR", system-ui, sans-serif';
        ctx.fillText('목표', PAD.l - 6, y);
        ctx.font = FONT;
      }
    }
    function pick(clientX) {
      const r = c.getBoundingClientRect();
      const { slot } = geom();
      const i = Math.floor((clientX - r.left - PAD.l) / slot);
      return Math.max(0, Math.min(n - 1, i));
    }
    c.addEventListener('click', (e) => { sel = pick(e.clientX); draw(); o.onSelect && o.onSelect(sel); });
    draw();
    return { draw, select(i) { sel = i; draw(); } };
  }

  /**
   * 시간축 추세 차트: 점(개별 러닝) + 선(이동평균/CTL 등)
   * o: {x0, x1, dots:{pts:[{x,y,ref}], color}, lines:[{pts:[{x,y}], color}], height, tickFmt, minRange, onPick(info), zero}
   */
  function trend(el, o) {
    const H = o.height || 150;

    const PAD = { l: 42, r: 10, t: 12, b: 22 };
    const vals = [];
    if (o.dots) for (const p of o.dots.pts) vals.push(p.y);
    for (const l of o.lines || []) for (const p of l.pts) vals.push(p.y);

      W = size();
      ctx.clearRect(0, 0, W, H);

      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';

        ctx.strokeStyle = C.grid; ctx.lineWidth = 1;

      // 월 경계 눈금
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = C.muted;
      const d = new Date(x0); d.setDate(1); d.setHours(0, 0, 0, 0);
      const spanDays = (x1 - x0) / 864e5;
      const stepM = spanDays > 200 ? 2 : 1;
      let lastPx = -100;
      while (+d <= x1) {
        if (+d >= x0) {
          const px = X(+d);
          if (px - lastPx > 34 && px < W - PAD.r - 8) {
            ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(Math.round(px) + 0.5, H - PAD.b); ctx.lineTo(Math.round(px) + 0.5, H - PAD.b + 4); ctx.stroke();
            ctx.fillText(`${d.getMonth() + 1}월`, px, H - PAD.b + 6); lastPx = px;
          }
        }
        d.setMonth(d.getMonth() + stepM);

      if (o.dots) {
        for (const p of o.dots.pts) {
          ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 3.5, 0, Math.PI * 2);

        ctx.stroke();
      }
      if (picked) {
        const px = Math.round(X(picked.x)) + 0.5;
        ctx.strokeStyle = C.text2; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px, PAD.t - 4); ctx.lineTo(px, H - PAD.b); ctx.stroke();
        if (picked.dot) dot(ctx, X(picked.dot.x), Y(picked.dot.y), 4.5, o.dots.color);
        (picked.vals || []).forEach((v, k) => { if (v != null) dot(ctx, px, Y(v), 4, o.lines[k].color); });
      }
    }
    function nearestLineVal(l, xv) {
      if (!l.pts.length) return null;
      let best = l.pts[0];
      for (const p of l.pts) if (Math.abs(p.x - xv) < Math.abs(best.x - xv)) best = p;
      return best;
    }
    function pick(clientX, clientY) {
      const r = c.getBoundingClientRect();
      const xv = x0 + ((clientX - r.left - PAD.l) / (r.width - PAD.l - PAD.r)) * (x1 - x0);

      const lineVals = (o.lines || []).map((l) => nearestLineVal(l, dotP ? dotP.x : xv));
      const xx = dotP ? dotP.x : (lineVals[0] ? lineVals[0].x : xv);

    c.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) pick(e.clientX, e.clientY); });

    if (errs.length) await dialog({ title: '가져오지 못한 파일', body: errs.slice(0, 5).join('\n'), cancel: null });
    requestPersist();
    if (ok) fillWeather(null).then((n) => { if (n) toast(`날씨 ${n}건을 기록했어요`, 2000); });
    if ((ok === 1 || (merged.length === 1 && !ok)) && lastId) { S.cameFromList = true; S.cache.delete(lastId); go('run-' + lastId); }
    else route();
  }
  /* 삼성헬스 '개인 데이터 다운로드'의 운동 live_data JSON 등에서 케이던스·심박·파워를 시간으로 맞춰 기존 기록에 합침 */
  async function mergeLiveData(j) {
    let arr = j;
    if (!Array.isArray(arr) && arr && typeof arr === 'object') arr = arr.live_data || arr.data || arr.samples || Object.values(arr).find(Array.isArray);
    if (!Array.isArray(arr)) throw new Error('지원하지 않는 JSON 형식이에요');
    const numv = (v) => (v == null || v === '' ? NaN : +v);
    const toMs = (v) => (typeof v === 'number' ? (v < 1e11 ? v * 1000 : v) : typeof v === 'string' ? (/^\d+$/.test(v) ? toMs(+v) : Date.parse(v)) : NaN);
    const series = { cad: [], hr: [], pwr: [] };
    for (const o of arr) {
      if (!o || typeof o !== 'object') continue;
      const t = toMs(o.start_time ?? o.startTime ?? o.time ?? o.timestamp ?? o.ts);
      if (!fin(t)) continue;
      const cad = numv(o.cadence ?? o.cad ?? o.step_cadence), hr = numv(o.heart_rate ?? o.heartRate ?? o.hr ?? o.bpm), pw = numv(o.power ?? o.watts);
      if (fin(cad) && cad > 0) series.cad.push([t, cad]);
      if (fin(hr) && hr > 30) series.hr.push([t, hr]);
      if (fin(pw) && pw > 0) series.pwr.push([t, pw]);
    }
    const keys = Object.keys(series).filter((k) => series[k].length >= 5);
    if (!keys.length) throw new Error('JSON에서 시간별 케이던스·심박 데이터를 찾지 못했어요');
    keys.forEach((k) => series[k].sort((x, y) => x[0] - y[0]));
    const t0 = Math.min(...keys.map((k) => series[k][0][0])), t1 = Math.max(...keys.map((k) => series[k][series[k].length - 1][0]));
    let best = null, bestOv = 0;
    for (const a of S.acts) {
      const ov = Math.min(a.start + a.summary.elapsed * 1000, t1) - Math.max(a.start, t0);
      if (ov > bestOv) { bestOv = ov; best = a; }
    }
    if (!best || bestOv < 60000) throw new Error('시간이 겹치는 러닝 기록이 없어요. 같은 러닝의 GPX를 먼저 가져오세요');
    const st = await DB.get('streams', best.id);
    const R = st.raw, n = R.t.length;
    const fields = [];
    for (const k of keys) {
      const src = series[k];
      const hasOwn = Array.prototype.filter.call(R[k], (x) => fin(x) && x > 0).length > n * 0.3;
      if (hasOwn && k !== 'cad') continue; // 원본 GPX에 이미 있으면 유지
      const out = new Float32Array(n).fill(NaN);
      let j2 = 0, cnt = 0;
      for (let i = 0; i < n; i++) {
        const tm = best.start + R.t[i] * 1000;
        while (j2 < src.length - 1 && src[j2 + 1][0] <= tm) j2++;
        let kk = j2;
        if (j2 < src.length - 1 && Math.abs(src[j2 + 1][0] - tm) < Math.abs(src[j2][0] - tm)) kk = j2 + 1;
        if (Math.abs(src[kk][0] - tm) <= 15000) { out[i] = src[kk][1]; cnt++; }
      }
      if (cnt > n * 0.3) { R[k] = out; fields.push(k === 'cad' ? '케이던스' : k === 'hr' ? '심박' : '파워'); }
    }
    if (!fields.length) throw new Error('합칠 새 데이터가 없어요');
    await DB.put('streams', st);
    best.summary = E.analyze(R, S.settings, { summaryOnly: true }).summary;
    if (best.typeAuto) best.type = E.guessType(best.summary, best.name, S.settings);
    await DB.put('acts', best);
    S.cache.delete(best.id);
    return { id: best.id, name: `${fmtDate(best.start)} ${best.name}`, fields };
  }
  async function handleShareInbox() {
    if (!/[?&]shared=1/.test(location.search) || !('caches' in window)) return;
    try {
      const cache = await caches.open('runlog-share');
      const keys = await cache.keys();
      const files = [];
      for (const k of keys) {
        const res = await cache.match(k);
        const name = decodeURIComponent(k.url.split('/').pop().replace(/^\d+-\d+-/, ''));
        files.push(new File([await res.blob()], name));
        await cache.delete(k);
      }
      history.replaceState(null, '', location.pathname + location.hash);
      if (files.length) await importFiles(files);
    } catch (e) { /* noop */ }
  }

  /* ───────── 재계산(설정 변경 시) ───────── */
  async function recomputeAll() {

    for (const a of S.acts) {
      i++;

  /* ───────── 집계 ───────── */
  function agg(list) {
    const r = { n: list.length, dist: 0, time: 0, gain: 0, trimp: 0, longest: 0 };
    let hrT = 0, hrS = 0, efD = 0, efS = 0, cdT = 0, cdS = 0, stD = 0, stS = 0;
    for (const a of list) {
      const s = a.summary;
      r.dist += s.dist; r.time += s.moving; r.longest = Math.max(r.longest, s.dist);
      if (fin(s.gain)) r.gain += s.gain;
      if (fin(s.trimp)) r.trimp += s.trimp;
      if (fin(s.avgHR)) { hrT += s.moving; hrS += s.avgHR * s.moving; }
      if (fin(s.ef)) { efD += s.dist; efS += s.ef * s.dist; }
      if (fin(s.avgCad)) { cdT += s.moving; cdS += s.avgCad * s.moving; }
      if (fin(s.stride)) { stD += s.dist; stS += s.stride * s.dist; }
    }
    r.pace = r.dist ? (r.time / r.dist) * 1000 : NaN;
    r.hr = hrT ? hrS / hrT : NaN; r.ef = efD ? efS / efD : NaN; r.cad = cdT ? cdS / cdT : NaN; r.stride = stD ? stS / stD : NaN;
    return r;
  }
  function periods(gran, count) {
    const out = [];
    const now = new Date();
    if (gran === 'day') {
      for (let k = count - 1; k >= 0; k--) {
        const s = dayStart(now); s.setDate(s.getDate() - k);
        const e = new Date(s); e.setDate(e.getDate() + 1);
        out.push({ key: ymd(s), s, e, short: `${s.getDate()}`, label: `${s.getMonth() + 1}월 ${s.getDate()}일 (${WD[s.getDay()]})${k === 0 ? ' · 오늘' : ''}` });
      }
    } else if (gran === 'week') {
      const m0 = monday(now);
      for (let k = count - 1; k >= 0; k--) {
        const s = new Date(m0); s.setDate(s.getDate() - 7 * k);
        const e = new Date(s); e.setDate(e.getDate() + 7);
        const last = new Date(e); last.setDate(last.getDate() - 1);
        out.push({ key: ymd(s), s, e, short: md(s), label: `${md(s)} – ${md(last)}${k === 0 ? ' · 이번 주' : k === 1 ? ' · 지난 주' : ''}` });
      }
    } else {
      for (let k = count - 1; k >= 0; k--) {
        const s = new Date(now.getFullYear(), now.getMonth() - k, 1);
        const e = new Date(s.getFullYear(), s.getMonth() + 1, 1);
        out.push({ key: `${s.getFullYear()}-${s.getMonth() + 1}`, s, e, short: `${s.getMonth() + 1}월`, label: `${s.getFullYear()}년 ${s.getMonth() + 1}월${k === 0 ? ' · 이번 달' : ''}` });
      }
    }
    return out;
  }
  const actsIn = (p) => S.acts.filter((a) => a.start >= +p.s && a.start < +p.e);

  function loadSeries(days) {
    if (!S.acts.length) return null;
    const first = dayStart(Math.min(...S.acts.map((a) => a.start)));
    const today = dayStart(Date.now());
    const daily = new Map();
    for (const a of S.acts) if (fin(a.summary.trimp)) { const k = ymd(dayStart(a.start)); daily.set(k, (daily.get(k) || 0) + a.summary.trimp); }
    if (!daily.size) return null;
    let ctl = 0, atl = 0;
    const out = [];
    const startShow = new Date(today); startShow.setDate(startShow.getDate() - days);
    for (let d = new Date(first); d <= today; d.setDate(d.getDate() + 1)) {
      const v = daily.get(ymd(d)) || 0;
      ctl += (v - ctl) / 42; atl += (v - atl) / 7;
      if (d >= startShow) out.push({ x: +d, ctl, atl, tsb: ctl - atl });
    }
    return out;
  }

  /* ───────── 썸네일 ───────── */
  function drawThumb(cv, pts) {
    const dpr = Math.min(3, window.devicePixelRatio || 1), w = cv.clientWidth || 56, h = cv.clientHeight || 56;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!pts || pts.length < 2) return;
    const cos = Math.cos((pts[0][0] * Math.PI) / 180);
    const xs = pts.map((p) => p[1] * cos), ys = pts.map((p) => p[0]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const sc = Math.min((w - 10) / (x1 - x0 || 1e-9), (h - 10) / (y1 - y0 || 1e-9));
    const ox = (w - (x1 - x0) * sc) / 2, oy = (h - (y1 - y0) * sc) / 2;
    ctx.strokeStyle = C.accent; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => { const x = ox + (xs[i] - x0) * sc, y = h - (oy + (ys[i] - y0) * sc); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  }

  /* ───────── 목표 대회 · 기록 예측 · PB ───────── */
  const RIEGEL = 1.06;
  function predictFromAct(a, D) {
    let best = Infinity;
    for (const [k, t] of Object.entries(a.summary.best || {})) {
      const d = +k;
      if (d < 5000 || d > D * 1.05) continue;
      const p = t * Math.pow(D / d, RIEGEL);
      if (p < best) best = p;
    }
    return best;
  }
  function predictionAt(ms, D, days) {
    let best = Infinity;
    for (const a of S.acts) if (a.start <= ms && a.start > ms - days * 864e5) best = Math.min(best, predictFromAct(a, D));
    return best;
  }
  function goalInfo() {
    const g = S.settings;
    if (!g.goalTime || !g.goalDist) return null;
    const D = g.goalDist;
    const series = [];
    const m0 = monday(Date.now());
    for (let w = 15; w >= 0; w--) {
      const end = new Date(m0); end.setDate(end.getDate() - 7 * w + 7);
      const t = predictionAt(Math.min(+end, Date.now()), D, 56);
      if (fin(t)) series.push({ x: Math.min(+end, Date.now()), y: t });
    }
    const now = series.length ? series[series.length - 1].y : NaN;
    let dday = null;
    if (g.goalDate) { const d = new Date(g.goalDate + 'T00:00:00'); dday = Math.ceil((d - dayStart(Date.now())) / 864e5); }
    return { name: g.goalName || '목표 대회', D, target: g.goalTime, now, series, dday, pace: g.goalTime / D * 1000, first: series.length ? series[0].y : NaN };
  }
  function goalCard(G) {
    if (!G) return html`<section class="goal empty-goal"><h2>목표 대회를 정해 보세요</h2><p>목표 기록을 넣으면 최근 기록으로 예상 완주 시간을 계산하고, 목표까지 얼마나 남았는지 매주 보여줘요.</p><button class="btn small primary" data-go="prefs">목표 설정</button></section>`;
    const has = fin(G.now);
    const gap = has ? G.now - G.target : NaN;
    const gained = has && fin(G.first) ? G.first - G.now : NaN;
    const dist = G.D >= 42000 ? '풀코스' : G.D >= 21000 ? '하프' : G.D >= 9900 ? '10K' : `${(G.D / 1000).toFixed(1)}K`;
    return html`<section class="goal">
      <div class="goal-top">
        <div><h2>${G.name}</h2><span class="goal-meta">${dist}, 목표 ${fmtDur(G.target)}</span></div>
        ${G.dday != null ? html`<div class="dday${G.dday < 0 ? ' past' : ''}"><b class="num">${G.dday > 0 ? `D-${G.dday}` : G.dday === 0 ? 'D-DAY' : '완료'}</b></div>` : ''}
      </div>
      ${has ? html`
        <div class="goal-pred">
          <span class="lbl">지금 달리면 예상 기록</span>

  function drawGoalChart(cv, G) {
    const w = cv.parentElement.clientWidth, h = 92;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pts = G.series;
    const ys = pts.map((p) => p.y).concat(G.target);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = Math.max(60, (hi - lo) * 0.18); lo -= pad; hi += pad;
    const L = 4, R = w - 4, T = 8, B = h - 18;
    const X = (i) => L + (i / (pts.length - 1)) * (R - L);
    const Y = (v) => T + ((v - lo) / (hi - lo)) * (B - T); // 빠를수록 위
    // 목표선
    const gy = Math.round(Y(G.target)) + 0.5;
    ctx.fillStyle = 'rgba(242,184,75,.10)'; ctx.fillRect(L, T, R - L, gy - T);
    ctx.strokeStyle = 'rgba(242,184,75,.9)'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(L, gy); ctx.lineTo(R, gy); ctx.stroke();
    ctx.font = '600 11px "IBM Plex Sans KR", system-ui, sans-serif'; ctx.fillStyle = '#F2B84B'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(`목표 ${fmtDur(G.target)}`, L + 2, gy - 3);
    // 예측선
    ctx.strokeStyle = '#EEF2F7'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(X(i), Y(p.y)) : ctx.moveTo(X(i), Y(p.y)))); ctx.stroke();
    const lx = X(pts.length - 1), ly = Y(pts[pts.length - 1].y);
    ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI * 2); ctx.fillStyle = '#1A1F28'; ctx.fill();
    ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2); ctx.fillStyle = '#EEF2F7'; ctx.fill();
    ctx.fillStyle = '#7F8A9C'; ctx.font = '500 10px "IBM Plex Sans KR", system-ui, sans-serif'; ctx.textBaseline = 'top';
    ctx.textAlign = 'left'; ctx.fillText('16주 전', L, B + 5);
    ctx.textAlign = 'right'; ctx.fillText('이번 주', R, B + 5);
  }
  function computePBs() {
    const m = new Map(), best = {};
    const asc = S.acts.slice().sort((a, b) => a.start - b.start);
    for (const a of asc) {
      const list = [];
      for (const [k, t] of Object.entries(a.summary.best || {})) {
        if (best[k] != null && t < best[k]) list.push({ k: +k, t, prev: best[k] });
        if (best[k] == null || t < best[k]) best[k] = t;
      }
      if (list.length) m.set(a.id, list.sort((x, y) => x.k - y.k));
    }
    S.pbs = m;
  }
  function progressRows() {
    const now = Date.now(), d28 = 28 * 864e5;
    const cur = S.acts.filter((a) => a.start > now - d28), prev = S.acts.filter((a) => a.start <= now - d28 && a.start > now - 2 * d28);
    const rows = [];
    if (!cur.length) return rows;
    const ac = agg(cur), ap = agg(prev);
    if (ap.dist > 0) {
      const d = (ac.dist / ap.dist - 1) * 100;
      rows.push({ label: '주 평균 거리', value: `${(ac.dist / 4000).toFixed(1)} km`, sub: `${d >= 0 ? '+' : ''}${d.toFixed(0)}%`, dir: d > 2 ? 'up' : d < -2 ? 'down' : 'flat' });
    }
    const efOf = (list) => { const e = list.filter((a) => (a.type === 'easy' || a.type === 'long') && fin(a.summary.ef)); return e.length ? e.reduce((s, a) => s + a.summary.ef, 0) / e.length : NaN; };
    const e1 = efOf(cur), e0 = efOf(prev);
    if (fin(e1) && fin(e0)) {
      const d = (e1 / e0 - 1) * 100;
      rows.push({ label: '이지·롱런 심박 효율', value: `${e1.toFixed(2)} m/beat`, sub: `${d >= 0 ? '+' : ''}${d.toFixed(1)}%`, dir: d > 0.5 ? 'up' : d < -0.5 ? 'down' : 'flat' });
    }
    const pbCount = cur.reduce((n, a) => n + (S.pbs.get(a.id) || []).filter((x) => x.k >= 5000).length, 0);
    if (pbCount) {
      const last = cur.find((a) => (S.pbs.get(a.id) || []).some((x) => x.k >= 5000));
      const lp = (S.pbs.get(last.id) || []).filter((x) => x.k >= 5000).pop();
      rows.push({ label: '최고 기록 경신', value: `${pbCount}회`, sub: `${BEST_LABEL[lp.k]} ${fmtDur(lp.t)}`, dir: 'up' });
    }
    return rows;
  }

    return { efAvg: same.reduce((s, x) => s + x.summary.ef, 0) / same.length, efN: same.length, typeLabel: (TYPE[a.type] || TYPE.other).label };

          <td class="pace"><div class="pbar"><i style="width:${w}%"></i></div><span>${fmtPace(x.pace)}</span></td>
          ${s.hasEle ? html`<td>${fmtPace(x.gap)}</td>` : ''}
          ${s.hasHR ? html`<td>${fmtInt(x.hr)}</td>` : ''}
          ${s.hasCad ? html`<td>${fmtInt(x.cad)}</td>` : ''}
          ${s.hasEle ? html`<td class="${eleCls}">${fin(x.gain) ? eleTxt : '–'}</td>` : ''}
        </tr>`;
      })}</tbody></table>
      <p class="fine">막대는 속도(길수록 빠름). GAP는 오르막·내리막을 평지 기준으로 환산한 페이스예요. 행을 누르면 그래프·지도에서 위치를 보여줘요.</p>`;
  }
  function hillsList(A) {
    const items = [
      ...A.hills.climbs.map((h) => ({ ...h, up: true })),
      ...A.hills.descents.map((h) => ({ ...h, up: false })),
    ].sort((x, y) => x.a - y.a);
    return html`<ul class="hills">${items.map((h) => html`<li>
      <span class="hill-badge ${h.up ? 'up' : 'down'}">${h.up ? '▲' : '▼'}</span>
      <div class="hill-main"><b>${(h.a / 1000).toFixed(2)}–${(h.b / 1000).toFixed(2)} km</b><span>${h.up ? '+' : '−'}${Math.round(h.gain)}m · ${h.up ? '' : '−'}${(h.grade * 100).toFixed(1)}% · ${Math.round(h.b - h.a)}m</span></div>
      <div class="hill-pace"><b>${fmtPace(h.pace)}</b><span>보정 ${fmtPace(h.gap)}${fin(h.hr) ? ` · ${Math.round(h.hr)}bpm` : ''}</span></div>
    </li>`)}</ul>
    <p class="fine">경사 보정 페이스가 평소 페이스보다 빠르면 오르막을 실제보다 강하게 달린 거예요.</p>`;
  }
  function zonesBlock(s) {
    const tot = s.zones.reduce((x, y) => x + y, 0) || 1;
    const zb = E.zoneBounds(S.settings).map(Math.round);
    const ranges = [`< ${zb[0]}`, `${zb[0]}–${zb[1] - 1}`, `${zb[1]}–${zb[2] - 1}`, `${zb[2]}–${zb[3] - 1}`, `≥ ${zb[3]}`];
    return html`<div class="segbar">${s.zones.map((z, i) => {
      const p = (z / tot) * 100;
      if (p <= 0) return '';
      return html`<div style="flex:${p} 1 0;background:${C.zones[i]};color:${i >= 3 ? '#0b0b0b' : '#ffffff'}" title="Z${i + 1} ${Math.round(p)}%">${p >= 9 ? `${Math.round(p)}%` : ''}</div>`;
    })}</div>
    <table class="zones">${s.zones.map((z, i) => html`<tr><td><i class="sw" style="background:${C.zones[i]}"></i>Z${i + 1} ${ZONE_NAMES[i]}</td><td class="muted">${ranges[i]} bpm</td><td>${fmtDur(z)}</td><td class="r">${Math.round((z / tot) * 100)}%</td></tr>`)}</table>
    <p class="fine">${S.settings.zoneMethod === 'max' ? '최대 심박' : '여유 심박(카르보넨)'} 기준 · 최대 ${S.settings.hrMax} / 안정 ${S.settings.hrRest} bpm (설정에서 변경)</p>`;
  }

  /* ───────── 지도 ───────── */
  function setupMap(A, s) {
    const L = window.L;
    const el = $('#map');
    if (!L || !el) return;
    const tr = A.track;
    if (tr.lat.length < 2) return;
    const map = L.map(el, { zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, tap: false, touchZoom: true });
    S.map = map;
    const tile = TILES[S.settings.mapStyle] || TILES.dark;
    let tileErr = 0;
    L.tileLayer(tile[0], { attribution: tile[1], maxZoom: 19, className: tile[2], detectRetina: false })
      .on('tileerror', () => { if (++tileErr === 3) { const nt = $('#mapNote'); if (nt) { nt.hidden = false; setTimeout(() => { nt.hidden = true; }, 5000); } } })
      .on('tileload', () => { tileErr = -1000; $('#mapNote').hidden = true; })
      .addTo(map);
    const ll = tr.lat.map((la, i) => [la, tr.lon[i]]);
    const bounds = L.latLngBounds(ll);
    map.fitBounds(bounds, { padding: [24, 24] });
    const ser = A.series;
    const total = s.dist;
    const layer = L.layerGroup().addTo(map);
    const sIdx = (d) => Math.max(0, Math.min(ser.x.length - 1, Math.round((d / total) * (ser.x.length - 1))));

    const kmLayer = L.layerGroup().addTo(map);
    // km 표시: 화면에서 겹치는 표시는 생략(왕복 코스 등)
    function drawKm() {
      kmLayer.clearLayers();
      const placed = [];
      for (const m of A.kmMarks) {
        const pt = map.latLngToContainerPoint([m.lat, m.lon]);
        if (placed.some((q) => Math.abs(q.x - pt.x) < 28 && Math.abs(q.y - pt.y) < 22)) continue;
        placed.push(pt);
        L.marker([m.lat, m.lon], { icon: L.divIcon({ className: 'km-ic', html: `<span>${m.km}</span>`, iconSize: [22, 18], iconAnchor: [11, 9] }), interactive: false, keyboard: false }).addTo(kmLayer);
      }
    }
    map.on('zoomend', drawKm);
    function draw(mode) {
      layer.clearLayers();
      const arr = mode === 'hr' ? ser.hr : mode === 'ele' ? ser.ele : ser.pace.map((p) => (p ? 1000 / p : null));
      const vals = arr.filter((x) => x != null && fin(x)).sort((x, y) => x - y);
      const lo = vals[Math.floor(vals.length * 0.05)], hi = vals[Math.ceil(vals.length * 0.95) - 1];
      const nb = C.ramp.length;
      const bucket = (x) => (x == null || !fin(x) ? -1 : Math.max(0, Math.min(nb - 1, Math.floor(((x - lo) / (hi - lo || 1)) * nb))));
      L.polyline(ll, { color: '#12151C', weight: 7, opacity: 0.6, interactive: false }).addTo(layer);
      let cur = [ll[0]], cb = bucket(arr[sIdx(tr.d[0])]);
      for (let i = 1; i < ll.length; i++) {
        const b = bucket(arr[sIdx(tr.d[i])]);
        cur.push(ll[i]);
        if (b !== cb || i === ll.length - 1) {
          L.polyline(cur, { color: cb < 0 ? '#5a5955' : C.ramp[cb], weight: 4, opacity: 1, interactive: false, lineCap: 'round' }).addTo(layer);
          cur = [ll[i]]; cb = b;
        }
      }
      drawKm();
      L.circleMarker(ll[0], { radius: 6, color: '#12151C', weight: 2, fillColor: '#EEF2F7', fillOpacity: 1 }).addTo(layer);
      L.circleMarker(ll[ll.length - 1], { radius: 6, color: '#12151C', weight: 2, fillColor: C.accent, fillOpacity: 1 }).addTo(layer);
      const fmtL = mode === 'hr' ? (x) => `${Math.round(x)}` : mode === 'ele' ? (x) => `${Math.round(x)}m` : (x) => fmtPace(1000 / x);
      const label = mode === 'hr' ? '심박' : mode === 'ele' ? '고도' : '페이스';
      put($('#mapLegend'), html`<span>${label}</span><span>${fmtL(lo)}</span><i style="background:linear-gradient(90deg,${C.ramp.join(',')})"></i><span>${fmtL(hi)}</span><span class="ml-dots"><i style="background:#EEF2F7"></i>출발 <i style="background:${C.accent}"></i>도착</span>`);
    }
    draw(S.mapMode === 'hr' && !s.hasHR ? 'pace' : S.mapMode === 'ele' && !s.hasEle ? 'pace' : S.mapMode);
    const mm = $('#mapMode');
    mm && mm.addEventListener('click', (e) => {
      const b = e.target.closest('[data-mm]'); if (!b) return;
      S.mapMode = b.dataset.mm;
      $$('#mapMode button').forEach((x) => x.classList.toggle('on', x === b));
      draw(S.mapMode);
    });
    const cursor = L.circleMarker(ll[0], { radius: 8, color: '#ffffff', weight: 3, fillColor: '#e66767', fillOpacity: 1, interactive: false });
    Scrub.on((i) => {
      if (i < 0) { cursor.remove(); return; }
      const D = ser.x[i] * 1000;
      let lo = 0, hi = tr.d.length - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tr.d[m] <= D) lo = m; else hi = m; }
      cursor.setLatLng(ll[lo]);
      if (!map.hasLayer(cursor)) cursor.addTo(map);
    });
    const wrap = $('#mapWrap');
    $('#mapFull').addEventListener('click', () => {
      const full = !wrap.classList.contains('full');
      wrap.classList.toggle('full', full);
      put($('#mapFull'), full ? ICON.close : ICON.expand);
      document.body.classList.toggle('noscroll', full);
      full ? map.dragging.enable() : map.dragging.disable();
      full ? map.doubleClickZoom.enable() : map.doubleClickZoom.disable();
      if (full && !map._zc) { map._zc = L.control.zoom({ position: 'bottomright' }).addTo(map); }
      else if (!full && map._zc) { map._zc.remove(); map._zc = null; }
      setTimeout(() => { map.invalidateSize(); map.fitBounds(bounds, { padding: [24, 24] }); }, 60);
    });
  }

  /* ═════════ 통계 ═════════ */
  function renderStats() {
    setTop('통계', { tab: 'stats' });
    const v = $('#view');
    if (!S.acts.length) { put(v, html`<div class="empty"><p>기록이 쌓이면 일간·주간·월간 통계와 러닝 이코노미 추세를 보여드려요.</p><button class="btn primary" data-act="import">GPX 가져오기</button></div>`); return; }
    const gran = S.statsGran;
    const count = gran === 'day' ? 28 : gran === 'week' ? 16 : 12;
    const ps = periods(gran, count);
    const sums = ps.map((p) => agg(actsIn(p)));
    let sel = ps.findIndex((p) => p.key === S.statsSel[gran]);
    if (sel < 0) sel = ps.length - 1;

    // 최고 기록
    const bests = {};
    for (const a of S.acts) for (const [k, t] of Object.entries(a.summary.best || {})) if (!bests[k] || t < bests[k].t) bests[k] = { t, a };
    const bestKeys = Object.keys(bests).map(Number).sort((x, y) => x - y);
    // 신발
    const shoeMap = new Map();
    for (const a of S.acts) { const sh = shoeOf(a); if (!sh) continue; const key = sh.id || sh.name; const r = shoeMap.get(key) || { name: sh.name, n: 0, d: (+sh.startKm || 0) * 1000, limit: sh.limitKm || 0 }; r.n++; r.d += a.summary.dist; shoeMap.set(key, r); }
    const load = loadSeries(120);
    const lastLoad = load && load[load.length - 1];
    const tsbSt = !lastLoad ? null : lastLoad.tsb > 5 ? ['good', '회복됨 · 컨디션 좋음'] : lastLoad.tsb >= -10 ? ['info', '적정 훈련 상태'] : lastLoad.tsb >= -25 ? ['warn', '피로 누적 · 회복 필요'] : ['bad', '과부하 주의'];
    const typesAvail = TYPES.filter(([k]) => S.acts.some((a) => a.type === k && fin(a.summary.ef)));
    if (!typesAvail.some(([k]) => k === S.efType) && S.efType !== 'all') S.efType = typesAvail.length ? typesAvail[0][0] : 'all';

    put(v, html`
      <div class="seg" id="granSeg">${[['day', '일간'], ['week', '주간'], ['month', '월간']].map(([k, l]) => html`<button data-gran="${k}" class="${gran === k ? 'on' : ''}">${l}</button>`)}</div>
      <section class="card">
        <h3>${gran === 'day' ? '일별' : gran === 'week' ? '주별' : '월별'} 거리 <span class="h-sub">km · 막대를 누르면 해당 기간</span></h3>
        <div class="ch" id="chBars"></div>
      </section>
      <section class="card" id="periodCard"></section>

      <section class="card">
        <h3>러닝 이코노미 추세 <span class="h-sub">심박 효율 EF · m/beat</span></h3>
        <div class="chips" id="efChips">${[['all', '전체', C.muted], ...typesAvail].map(([k, l, c]) => html`<button class="chip sel${S.efType === k ? ' on' : ''}" data-ef="${k}"><i style="background:${c}"></i>${l}</button>`)}</div>
        <div class="readout small" id="efRead"></div>
        <div class="ch" id="chEf"></div>
        <p class="fine">점은 각 러닝, 선은 최근 5회 이동평균. 같은 유형(특히 이지런)끼리 비교해야 정확해요. 선이 오를수록 같은 심박으로 더 멀리 달리는 것 — 유산소 체력 향상 신호예요.</p>
      </section>

      <section class="card">
        <h3>케이던스 · 보폭 추세</h3>
        <div class="readout small" id="cadRead"></div>
        <div class="ch-title"><i class="lk" style="background:${C.cad}"></i>케이던스<span>spm</span></div><div class="ch" id="chCadT"></div>
        <div class="ch-title"><i class="lk" style="background:${C.stride}"></i>보폭<span>m</span></div><div class="ch" id="chStrT"></div>
      </section>

      ${load ? html`<section class="card">
        <h3>훈련 부하 <span class="h-sub">최근 120일 · TRIMP 기반</span></h3>
        <div class="grid3 tight">
          <div class="stat"><span class="lbl">체력 (CTL)</span><div><b>${lastLoad.ctl.toFixed(0)}</b></div></div>
          <div class="stat"><span class="lbl">피로 (ATL)</span><div><b>${lastLoad.atl.toFixed(0)}</b></div></div>
          <div class="stat"><span class="lbl">컨디션 (TSB)</span><div><b>${lastLoad.tsb >= 0 ? '+' : ''}${lastLoad.tsb.toFixed(0)}</b></div></div>
        </div>
        ${tsbSt ? html`<div class="status-line"><span class="status s-${tsbSt[0]}">${STATUS_ICON[tsbSt[0]]} ${tsbSt[1]}</span></div>` : ''}
        <div class="legend"><span><i class="lk" style="background:${C.pace}"></i>체력 CTL (42일)</span><span><i class="lk" style="background:${C.gap}"></i>피로 ATL (7일)</span></div>
        <div class="readout small" id="loadRead"></div>
        <div class="ch" id="chLoad"></div>
        <p class="fine">CTL은 장기 훈련량(체력), ATL은 최근 1주 부하(피로), TSB = CTL − ATL. 대회 전 테이퍼링으로 TSB를 +로 올리는 게 일반적이에요.</p>
      </section>` : ''}

      ${bestKeys.length ? html`<section class="card"><h3>개인 최고 기록 <span class="h-sub">GPS 구간 기준</span></h3>
        <div class="pr-list">${bestKeys.map((k) => html`<button class="pr" data-run="${bests[k].a.id}"><span class="pr-k">${BEST_LABEL[k]}</span><b>${fmtDur(bests[k].t)}</b><span class="muted">${fmtPace((bests[k].t / k) * 1000)}/km</span><span class="muted r">${fmtDate(bests[k].a.start)}</span></button>`)}</div></section>` : ''}

      ${shoeMap.size ? html`<section class="card"><h3>신발별 누적 거리</h3><table class="zones">${[...shoeMap.values()].sort((x, y) => y.d - x.d).map((r) => html`<tr><td>${r.name}${r.limit ? html`<div class="meter thin"><i style="width:${Math.min(100, r.d / 10 / r.limit)}%;${r.d / 1000 >= r.limit * 0.9 ? 'background:var(--serious)' : ''}"></i></div>` : ''}</td><td class="muted">${r.n}회</td><td class="r"><b>${fmtKm(r.d, 0)}</b>${r.limit ? ` / ${r.limit}` : ''} km</td></tr>`)}</table></section>` : ''}
    `);

    $('#granSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-gran]'); if (!b) return; S.statsGran = b.dataset.gran; route(); });
    const barsCh = Charts.bars($('#chBars'), {
      labels: ps.map((p) => p.short), values: sums.map((x) => +(x.dist / 1000).toFixed(1)), sel,
      goal: gran === 'week' ? S.settings.weekGoal : 0, valueFmt: (x) => `${x}`, height: 170,
      onSelect: (i) => { S.statsSel[gran] = ps[i].key; renderPeriod(ps, sums, i); },
    });
    S.charts.push(barsCh);
    renderPeriod(ps, sums, sel);

    // EF 추세
    const since = Date.now() - 180 * 864e5;
    const efPts = S.acts.filter((a) => a.start >= since && fin(a.summary.ef) && a.summary.dist >= 3000 && (S.efType === 'all' || a.type === S.efType))
      .sort((x, y) => x.start - y.start).map((a) => ({ x: a.start, y: a.summary.ef, a }));
    const roll = (pts, k) => pts.map((p, i) => { const w = pts.slice(Math.max(0, i - k + 1), i + 1); return { x: p.x, y: w.reduce((s, q) => s + q.y, 0) / w.length }; });
    const x0 = efPts.length ? Math.min(efPts[0].x, Date.now() - 30 * 864e5) : Date.now() - 90 * 864e5;
    const efColor = S.efType === 'all' ? C.pace : (TYPE[S.efType] || TYPE.other).color;
    const pickRead = (el, p, extra) => {
      if (!p || !p.dot) { put(el, html`<span class="ro-hint">점을 누르면 해당 러닝 정보가 보여요</span>`); return; }
      const a = p.dot.a;
      put(el, html`<button class="ro-link" data-run="${a.id}"><span class="ro-x"><b>${fmtDate(a.start)}</b></span>${extra(a)}<span class="ro-go">열기 ›</span></button>`);
    };
    if (efPts.length >= 2) {
      const efRead = $('#efRead'); pickRead(efRead, null);
      S.charts.push(Charts.trend($('#chEf'), {
        x0, x1: Date.now(), dots: { pts: efPts, color: efColor }, lines: [{ pts: roll(efPts, 5), color: efColor }],
        tickFmt: (x) => x.toFixed(2), minRange: 0.1, height: 160,
        onPick: (p) => pickRead(efRead, p, (a) => html`<span class="ro-i"><b>${a.summary.ef.toFixed(2)}</b><small>m/beat</small></span><span class="ro-i"><b>${fmtPace(a.summary.pace)}</b><small>/km</small></span><span class="ro-i"><b>${fmtInt(a.summary.avgHR)}</b><small>bpm</small></span><span class="ro-i"><b>${fmtKm(a.summary.dist, 1)}</b><small>km</small></span>`),
      }));
    } else put($('#chEf'), html`<p class="fine">이 유형의 심박 기록이 2개 이상 쌓이면 추세가 표시돼요.</p>`);
    $('#efChips').addEventListener('click', (e) => { const b = e.target.closest('[data-ef]'); if (!b) return; S.efType = b.dataset.ef; S.scroll.stats = window.scrollY; route(); });

    // 케이던스·보폭 추세
    const cadPts = S.acts.filter((a) => a.start >= since && fin(a.summary.avgCad)).sort((x, y) => x.start - y.start);
    if (cadPts.length >= 2) {
      const cx0 = Math.min(cadPts[0].start, Date.now() - 30 * 864e5);
      const cadRead = $('#cadRead'); pickRead(cadRead, null);
      const ex = (a) => html`<span class="ro-i"><b>${fmtInt(a.summary.avgCad)}</b><small>spm</small></span><span class="ro-i"><b>${a.summary.stride.toFixed(2)}</b><small>m</small></span><span class="ro-i"><b>${fmtPace(a.summary.pace)}</b><small>/km</small></span>`;
      const cp = cadPts.map((a) => ({ x: a.start, y: a.summary.avgCad, a }));
      const sp = cadPts.filter((a) => fin(a.summary.stride)).map((a) => ({ x: a.start, y: a.summary.stride, a }));
      S.charts.push(Charts.trend($('#chCadT'), { x0: cx0, x1: Date.now(), dots: { pts: cp, color: C.cad }, lines: [{ pts: roll(cp, 5), color: C.cad }], tickFmt: (x) => Math.round(x), minRange: 6, height: 120, onPick: (p) => pickRead(cadRead, p, ex) }));
      S.charts.push(Charts.trend($('#chStrT'), { x0: cx0, x1: Date.now(), dots: { pts: sp, color: C.stride }, lines: [{ pts: roll(sp, 5), color: C.stride }], tickFmt: (x) => x.toFixed(2), minRange: 0.1, height: 120, onPick: (p) => pickRead(cadRead, p, ex) }));
    } else put($('#cadRead'), html`<span class="ro-hint">케이던스가 담긴 기록이 2개 이상 필요해요.</span>`);

    // 훈련 부하
    if (load) {
      const lr = $('#loadRead');
      const showLoad = (pt) => put(lr, html`<span class="ro-x"><b>${fmtDate(pt.x)}</b></span><span class="ro-i"><i class="lk" style="background:${C.pace}"></i><b>${pt.ctl.toFixed(0)}</b><small>CTL</small></span><span class="ro-i"><i class="lk" style="background:${C.gap}"></i><b>${pt.atl.toFixed(0)}</b><small>ATL</small></span><span class="ro-i"><b>${pt.tsb >= 0 ? '+' : ''}${pt.tsb.toFixed(0)}</b><small>TSB</small></span>`);
      showLoad(lastLoad);
      S.charts.push(Charts.trend($('#chLoad'), {
        x0: load[0].x, x1: load[load.length - 1].x, zero: true,
        lines: [{ pts: load.map((p) => ({ x: p.x, y: p.ctl })), color: C.pace }, { pts: load.map((p) => ({ x: p.x, y: p.atl })), color: C.gap }],
        tickFmt: (x) => Math.round(x), minRange: 10, height: 150,
        onPick: (p) => { const pt = load.find((q) => q.x === p.x) || lastLoad; showLoad(pt); },
      }));
    }
  }
  function renderPeriod(ps, sums, i) {
    const p = ps[i], r = sums[i], prev = i > 0 ? sums[i - 1] : null;
    const list = actsIn(p).sort((x, y) => x.start - y.start);
    const dd = prev && prev.dist > 0 ? (r.dist / prev.dist - 1) * 100 : NaN;

  /* ═════════ 날씨 (Open-Meteo, 러닝 위치·시각 기준) ═════════ */
  function wmo(c) {

  function localYmd(ms) { return ymd(new Date(ms)); }
  async function fetchWeather(a) {
    const p = a.thumb && a.thumb[0];

        const hf = d.getHours() + d.getMinutes() / 60;
        const h0 = Math.max(0, Math.min(H.time.length - 1, Math.floor(hf))), h1 = Math.min(H.time.length - 1, h0 + 1), f = hf - Math.floor(hf);
        const lerp = (arr) => (arr && fin(arr[h0]) ? (fin(arr[h1]) ? arr[h0] + (arr[h1] - arr[h0]) * f : arr[h0]) : NaN);

        const temp = lerp(H.temperature_2m);

    }
