:root {
  --page: #12151C; --surface: #1A1F28; --surface2: #232A35; --surface3: #2D3542;
  --line: rgba(238, 242, 247, .08); --text: #EEF2F7; --text2: #B9C2D0; --muted: #7F8A9C;

  --num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body { font: 15px/1.5 "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; letter-spacing: -.005em; min-height: 100vh; -webkit-text-size-adjust: 100%; }
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
b { font-weight: 650; }
.muted { color: var(--muted); }
.r { text-align: right; }
.center { text-align: center; }

/* ── 상단·하단 바 ── */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; height: calc(52px + var(--st)); padding: var(--st) 12px 0; background: rgba(18, 21, 28, .92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { font-size: 13px; font-weight: 800; letter-spacing: .02em; color: var(--accent); }
.icon-btn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; border: 0; background: transparent; color: var(--text); padding: 0; }
.icon-btn svg { width: 22px; height: 22px; }
main { max-width: 680px; margin: 0 auto; padding: 12px 12px calc(92px + var(--sb)); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; padding: 6px 6px calc(6px + var(--sb)); background: rgba(22, 26, 34, .97); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.tab { flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 0; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--text); }
.tab.add { color: var(--text2); }
.tab .plus { display: grid; place-items: center; width: 44px; height: 28px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); }
.tab .plus svg { width: 18px; height: 18px; }

/* ── 공통 ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 650; color: var(--text); }
.h-sub { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
.eyebrow { font-size: 12px; color: var(--text2); font-weight: 600; }
.lbl { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.fine { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-weight: 650; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--critical); border-color: transparent; color: #fff; }
.btn.danger-ghost { background: transparent; color: #f08a8a; border-color: rgba(208, 59, 59, .4); width: 100%; margin-top: 12px; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.big { min-height: 52px; font-size: 16px; padding: 0 22px; }
.btn-col { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.btn-col .btn { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--text2); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.sel { padding: 6px 12px; font-size: 13px; }
.chip.sel.on { background: var(--text); color: #12151C; border-color: transparent; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; color: var(--muted); font-weight: 650; padding: 8px 0; border-radius: 9px; }
.seg button.on { background: var(--surface3); color: var(--text); }
.seg.small { margin: 0; border-radius: 10px; }
.seg.small button { padding: 5px 9px; font-size: 13px; border-radius: 8px; flex: none; }
.lk { display: inline-block; width: 12px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 5px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.delta { font-size: 12px; font-weight: 650; }
.delta.up { color: #6fd39a; }
.delta.down { color: var(--serious); }
.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 2px 8px; border-radius: 999px; border: 1px solid; margin-left: 8px; vertical-align: 2px; }
.s-good { color: #4cc94c; border-color: rgba(12, 163, 12, .5); }
.s-warn { color: var(--warn); border-color: rgba(250, 178, 25, .5); }
.s-bad { color: #f07070; border-color: rgba(208, 59, 59, .55); }
.s-info { color: var(--text2); border-color: var(--line); }
.status-line { margin: 2px 0 10px; }
.status-line .status { margin-left: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text2); margin: 8px 0 4px; }
.banner { background: rgba(250, 178, 25, .12); border: 1px solid rgba(250, 178, 25, .35); color: #f5d38a; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.tip { display: flex; flex-direction: column; gap: 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: var(--text2); }
.tip-btns { display: flex; gap: 8px; }

/* ── 빈 상태 ── */
.empty { text-align: center; padding: 40px 10px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty-ic { width: 84px; height: 84px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); }
.empty-ic svg { width: 46px; height: 46px; }
.empty h2 { margin: 6px 0 0; font-size: 20px; }
.empty p { margin: 0; color: var(--text2); max-width: 400px; }
.empty .fine { margin-top: 8px; }

/* ── 이번 주 ── */
.week-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hero { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin: 2px 0 2px; }
.hero b { font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; }
.hero > span { color: var(--muted); font-weight: 600; }
.hero .delta { margin-left: 4px; }
.week-mini { display: flex; gap: 5px; height: 58px; }
.wm-col { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 16px; }
.wm-bar { flex: 1; width: 8px; background: var(--surface3); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
.wm-bar i { display: block; width: 100%; background: var(--accent); border-radius: 4px; }
.wm-col span { font-size: 10px; color: var(--muted); }
.wm-col.today span { color: var(--text); font-weight: 700; }
.meter { height: 8px; background: rgba(212, 255, 58, .14); border-radius: 4px; margin: 12px 0 10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.week-sub { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ic-heart { width: 12px; height: 12px; color: #e66767; vertical-align: -1px; margin-right: 2px; }

/* ── 목록 ── */
.group-h { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); font-weight: 650; padding: 14px 4px 8px; }
.group-h span:last-child { color: var(--muted); font-weight: 500; }
.runs { display: flex; flex-direction: column; gap: 8px; }
.run { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 10px 10px; }
.run:active { background: var(--surface2); }
.thumb { width: 56px; height: 56px; border-radius: 12px; background: var(--surface2); flex: none; }
.run-main { flex: 1; min-width: 0; }
.run-meta { font-size: 12px; color: var(--muted); }
.run-name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 1px 0 3px; }
.run-stats { display: flex; gap: 10px; font-size: 13px; color: var(--text2); flex-wrap: wrap; }
.run-stats span { display: inline-flex; align-items: center; white-space: nowrap; }
.run-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.run-dist b { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }

/* ── 상세 ── */
.d-head { padding: 2px 2px 12px; }
.title-input { width: 100%; background: transparent; border: 0; border-bottom: 1px dashed transparent; font-size: 22px; font-weight: 700; padding: 2px 0 4px; margin: 2px 0 8px; border-radius: 0; outline: none; }
.title-input:focus { border-bottom-color: var(--muted); }
.type-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.type-row::-webkit-scrollbar { display: none; }
.map-wrap { position: relative; z-index: 0; isolation: isolate; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 12px; background: var(--surface2); }
.map { height: 270px; background: #161B23; }
.map-wrap.full { position: fixed; inset: 0; z-index: 60; border-radius: 0; margin: 0; border: 0; }
.map-wrap.full .map { height: 100%; }
.map-ctl { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 500; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
.map-wrap.full .map-ctl { top: calc(10px + var(--st)); }
.map-ctl > * { pointer-events: auto; }
.map-ctl .seg { background: rgba(18, 21, 28, .85); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.map-ctl .icon-btn { background: rgba(18, 21, 28, .85); border: 1px solid var(--line); }
.map-legend { position: absolute; left: 10px; bottom: 22px; z-index: 500; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); background: rgba(18, 21, 28, .85); padding: 5px 9px; border-radius: 10px; flex-wrap: wrap; max-width: calc(100% - 20px); }
.map-wrap.full .map-legend { bottom: calc(24px + var(--sb)); }
.map-legend > i { width: 54px; height: 6px; border-radius: 3px; }
.ml-dots { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; }
.ml-dots i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.map-note { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 400; font-size: 12px; color: var(--muted); background: rgba(18, 21, 28, .75); padding: 4px 10px; border-radius: 8px; pointer-events: none; white-space: nowrap; }
.km-ic span { display: grid; place-items: center; width: 22px; height: 18px; border-radius: 9px; background: rgba(18, 21, 28, .9); color: #f0efec; font: 700 10px system-ui, sans-serif; border: 1px solid rgba(255, 255, 255, .25); }
.leaflet-container { background: #161B23; font: 12px system-ui, sans-serif; }
.leaflet-control-attribution { background: rgba(18, 21, 28, .6) !important; color: var(--muted) !important; font-size: 9px !important; }
.leaflet-control-attribution a { color: var(--text2) !important; }
.leaflet-bar a { background: #232A35 !important; color: #EEF2F7 !important; border-color: #364050 !important; }

.hero3 { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 8px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.hero3 b { font-size: 25px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px; }
.grid3.tight { margin-top: 10px; }
.stat b { font-size: 17px; font-weight: 650; }
.econ { display: flex; flex-direction: column; gap: 14px; }
.econ-item { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.econ-item:last-child { border-bottom: 0; padding-bottom: 0; }
.econ-v b { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.econ-eq { font-size: 15px; color: var(--text2); margin: 2px 0; }
.econ-eq b { font-size: 20px; color: var(--text); }
.econ .sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
.ins { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ins li { display: flex; gap: 10px; font-size: 14px; color: var(--text2); line-height: 1.5; }
.ins-ic { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--surface3); color: var(--text2); margin-top: 1px; }
.k-good .ins-ic { background: rgba(12, 163, 12, .22); color: #4cc94c; }
.k-warn .ins-ic { background: rgba(250, 178, 25, .2); color: var(--warn); }
.k-bad .ins-ic { background: rgba(208, 59, 59, .25); color: #f07070; }
.k-hill .ins-ic { background: rgba(144, 133, 233, .22); color: #b3abf2; font-size: 9px; }

.readout { position: sticky; top: calc(52px + var(--st)); z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; min-height: 40px; padding: 8px 10px; margin: 0 -4px 6px; background: var(--surface2); border-radius: 10px; font-size: 14px; }
.readout.small { position: static; min-height: 36px; }
.readout b { font-weight: 700; }
.ro-hint { font-size: 12px; color: var(--muted); }
.ro-x { margin-right: 2px; }
.ro-i { display: inline-flex; align-items: baseline; white-space: nowrap; }
.ro-i .lk { align-self: center; }
.ro-link { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; width: 100%; border: 0; background: none; padding: 0; text-align: left; }
.ro-go { margin-left: auto; color: var(--accent); font-size: 13px; font-weight: 650; }
.ch-block { margin-top: 10px; }
.ch-title { font-size: 12px; color: var(--text2); font-weight: 650; margin: 8px 0 2px; display: flex; align-items: center; }
.ch-title .lk:not(:first-child) { margin-left: 10px; }
.ch-title span { color: var(--muted); font-weight: 500; margin-left: 6px; }
.ch { width: 100%; }
.chart-canvas { display: block; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.splits { font-size: 13px; }
.splits th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: right; padding: 0 4px 6px; }
.splits th.l { text-align: left; }
.splits td { text-align: right; padding: 5px 4px; border-top: 1px solid var(--line); white-space: nowrap; color: var(--text2); }
.splits td.k { color: var(--muted); width: 34px; }
.splits td.pace { text-align: left; width: 44%; color: var(--text); font-weight: 650; }
.splits td.pace { position: relative; }
.pbar { position: absolute; left: 4px; right: 44px; top: 50%; height: 16px; transform: translateY(-50%); }
.pbar i { display: block; height: 100%; background: rgba(57, 135, 229, .35); border-radius: 0 4px 4px 0; }
.splits td.pace span { position: relative; float: right; }
.splits tr.fast .pbar i { background: rgba(57, 135, 229, .7); }
.splits td.up { color: #f0a77f; }
.splits td.down { color: #8fbcf0; }
.splits td.mixed { color: var(--text2); font-size: 12px; }
.splits tbody tr { cursor: pointer; }
.hills { list-style: none; padding: 0; margin: 0; }
.hills li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.hills li:first-child { border-top: 0; }
.hill-badge { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; flex: none; }
.hill-badge.up { background: rgba(217, 89, 38, .2); color: #f0a77f; }
.hill-badge.down { background: rgba(57, 135, 229, .2); color: #8fbcf0; }
.hill-main, .hill-pace { display: flex; flex-direction: column; }
.hill-main { flex: 1; }
.hill-main span, .hill-pace span { font-size: 12px; color: var(--muted); }
.hill-pace { text-align: right; }
.segbar { display: flex; gap: 2px; height: 28px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
.segbar > div { display: flex; align-items: center; padding-left: 6px; font-size: 11px; font-weight: 700; min-width: 2px; border-radius: 4px; }
.segbar.thin { height: 8px; margin: 14px 0 0; border-radius: 4px; }
.zones { font-size: 13px; }
.zones td { padding: 6px 2px; border-top: 1px solid var(--line); color: var(--text2); }
.zones tr:first-child td { border-top: 0; }
.best-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
.best-row > div { display: flex; flex-direction: column; }
.best-row b { font-size: 17px; }
.best-row small { margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 13px; color: var(--text2); }
.field input, .field textarea { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 15px; outline: none; width: 100%; }
.field input:focus, .field textarea:focus { border-color: var(--muted); }
.field.row { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
.field.row > span { display: flex; flex-direction: column; color: var(--text); font-size: 14px; flex: 1; min-width: 0; }
.field.row > .seg { flex: none; }
.field.row > span small { margin: 2px 0 0; font-weight: 400; }
.field.row input { width: 96px; text-align: right; flex: none; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin: 0 0 6px; }
.kv span { color: var(--text2); }
.help details { border-top: 1px solid var(--line); padding: 10px 0; }
.help details:first-of-type { border-top: 0; }
.help summary { font-weight: 600; font-size: 14px; cursor: pointer; }
.help p { margin: 8px 0 0; font-size: 13px; color: var(--text2); line-height: 1.6; }

/* ── 통계 ── */
.mini-runs { margin-top: 12px; display: flex; flex-direction: column; }
.mini-run { display: grid; grid-template-columns: 92px 1fr auto 42px; gap: 8px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 9px 0; font-size: 13px; }
.mr-name { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); }
.mr-name i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.mini-run .muted:last-child { text-align: right; }
.pr-list { display: flex; flex-direction: column; }
.pr { display: grid; grid-template-columns: 48px 1fr auto auto; gap: 10px; align-items: baseline; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 0; text-align: left; font-size: 13px; }
.pr:first-child { border-top: 0; }
.pr-k { font-weight: 700; color: var(--accent); }
.pr b { font-size: 17px; }

/* ── 토스트·대화상자 ── */
#toast { position: fixed; left: 50%; bottom: calc(86px + var(--sb)); transform: translate(-50%, 20px); z-index: 80; background: #EEF2F7; color: #12151C; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#dialog { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .6); display: none; align-items: flex-end; justify-content: center; padding: 16px 16px calc(16px + var(--sb)); }
#dialog.on { display: flex; }
.dlg-box { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.dlg-box h3 { margin: 0 0 8px; font-size: 17px; }
.dlg-box p { margin: 0 0 16px; color: var(--text2); font-size: 14px; white-space: pre-line; }
.dlg-btns { display: flex; gap: 8px; }
.dlg-btns .btn { flex: 1; }
.drop-hint { display: none; position: fixed; inset: 12px; z-index: 95; border: 2px dashed var(--accent); border-radius: 20px; background: rgba(18, 21, 28, .88); color: var(--accent); font-weight: 700; place-items: center; font-size: 18px; }
body.drag .drop-hint { display: grid; }

@media (min-width: 560px) {
  .hero3 b { font-size: 30px; }
  .grid3 { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 360px) {
  .hero b { font-size: 34px; }
  .hero3 b { font-size: 21px; }
  .splits { font-size: 12px; }
}


/* ═════ v1.1 — 기록 향상 테마 ═════ */
.num, .hero b, .hero3 b, .stat b, .econ-v b, .econ-eq b, .run-dist b, .best-row b, .pr b, .readout b, .splits td, .zones td, .kv b {
  font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: 0;
}
.brand { color: var(--accent); font-family: var(--num); font-size: 16px; font-weight: 700; letter-spacing: .01em; }
.topbar h1 { font-size: 18px; font-weight: 700; }
h2 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.card h3 { font-size: 15px; font-weight: 700; }
.focus-ring, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 목표 대회 — 홈의 주인공 */
.goal { position: relative; overflow: hidden; border-radius: 22px; padding: 18px 18px 14px; margin-bottom: 14px;
  background: linear-gradient(180deg, #232A35 0%, #1A1F28 100%); border: 1px solid rgba(242, 184, 75, .28); }
.goal::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--accent); }
.goal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.goal h2 { font-size: 17px; }
.goal-meta { font-size: 13px; color: var(--text2); }
.dday b { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
.dday.past b { color: var(--muted); }
.goal-pred { margin-top: 14px; }
.goal-pred .lbl { font-size: 12px; color: var(--text2); }
.goal-pred .big { display: block; font-size: 64px; font-weight: 700; line-height: .95; letter-spacing: -.01em; margin-top: 2px; }
.goal-gap { margin-top: 8px; font-size: 14px; color: var(--text2); }
.goal-gap b { font-size: 18px; color: var(--text); }
.goal-gap.ok b { color: var(--accent); }
.goal-chart { margin: 12px -2px 4px; }
.goal-chart canvas { display: block; }
.goal-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--text2); padding-top: 8px; border-top: 1px solid var(--line); }
.goal-foot b { font-size: 16px; color: var(--text); }
.goal-foot .gain { color: #6fd39a; font-weight: 600; }
.goal-foot .lose { color: var(--serious); font-weight: 600; }
.goal-none { font-size: 14px; color: var(--text2); margin: 12px 0 4px; }
.empty-goal { border-style: dashed; background: var(--surface); }
.empty-goal::before { display: none; }
.empty-goal p { color: var(--text2); font-size: 14px; margin: 6px 0 12px; }

/* 이번 주 */
.week { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 14px; }
.week-head { display: flex; align-items: baseline; justify-content: space-between; }
.week-head .muted { font-family: var(--num); font-size: 14px; }
.week-body { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 6px; }
.week-num b { font-size: 44px; font-weight: 700; line-height: 1; }
.week-num span { margin-left: 6px; color: var(--muted); font-family: var(--num); font-size: 17px; font-weight: 600; }
.wm-bar { background: var(--surface3); }
.wm-bar i { background: var(--blue); }
.wm-col.today .wm-bar i { background: var(--accent); }
.meter { background: var(--surface3); height: 6px; margin: 14px 0 10px; }
.meter i { background: linear-gradient(90deg, var(--blue), var(--accent)); }
.week-sub { justify-content: space-between; }
.week-sub .left { color: var(--text); font-weight: 600; }
.week-sub .left.done { color: var(--accent); }

/* 최근 4주 변화 */
.progress { margin: 0 0 6px; }
.progress h2 { padding: 4px 4px 8px; }
.progress ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.progress li { display: grid; grid-template-columns: 22px 1fr auto auto; align-items: baseline; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.progress li:first-child { border-top: 0; }
.progress li b { font-size: 19px; font-weight: 700; }
.pg-ic { font-size: 10px; color: var(--muted); }
.pg-s { font-family: var(--num); font-size: 15px; font-weight: 600; min-width: 52px; text-align: right; color: var(--muted); }
.progress li.up .pg-ic, .progress li.up .pg-s { color: #6fd39a; }
.progress li.down .pg-ic, .progress li.down .pg-s { color: var(--serious); }

/* 목록 */
.group-h { align-items: baseline; padding: 18px 4px 8px; }
.group-h h2 { font-size: 15px; }
.run { border-radius: 18px; gap: 12px; }
.run.has-pb { border-color: rgba(242, 184, 75, .45); background: linear-gradient(90deg, rgba(242, 184, 75, .07), var(--surface) 55%); }
.run-stats { gap: 12px; font-size: 14px; }
.run-stats b { font-size: 16px; font-weight: 600; color: var(--text); }
.run-stats .num { font-size: 16px; }
.run-dist b { font-size: 28px; font-weight: 700; }
.pb-badge { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }

/* 상세 */
.title-input { font-size: 24px; letter-spacing: -.02em; }
.pb-banner { border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; background: rgba(242, 184, 75, .12); border: 1px solid rgba(242, 184, 75, .45); }
.pb-banner h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent); }
.pb-banner ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.pb-banner li { display: flex; align-items: baseline; gap: 10px; }
.pb-k { font-weight: 700; min-width: 34px; }
.pb-banner b { font-size: 24px; font-weight: 700; }
.pb-d { font-size: 13px; color: var(--text2); }
.hero3 { gap: 10px; }
.hero3 b { font-size: 31px; font-weight: 700; }
.stat b { font-size: 21px; font-weight: 600; }
.econ-v b { font-size: 34px; }
.econ-eq b { font-size: 24px; }
.best-row b { font-size: 22px; }
.pr b { font-size: 22px; }
.pr-k { color: var(--accent); }
.splits td { font-size: 15px; }
.splits td.pace { font-weight: 600; }
.splits tr.fast td.pace span { color: var(--accent); }
.splits tr.fast .pbar i { background: rgba(242, 184, 75, .45); }
.field.row input.wide { width: 170px; text-align: left; }
.btn.primary { box-shadow: none; }
@media (max-width: 360px) { .goal-pred .big { font-size: 54px; } .hero3 b { font-size: 28px; } }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

.tile-dark { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.5); }

/* 코치 코멘트 */
.coach { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
.coach-tag { font-size: 12px; font-weight: 700; color: var(--accent); }
.coach-head h3 { margin: 4px 0 12px; font-size: 19px; line-height: 1.35; letter-spacing: -.01em; }
.coach-sec { padding: 10px 0; border-top: 1px solid var(--line); }
.coach-sec h4 { margin: 0 0 6px; font-size: 13px; font-weight: 700; }
.coach-sec.good h4 { color: #6fd39a; }
.coach-sec.fix h4 { color: var(--serious); }
.coach-sec.next h4 { color: #8fbcf0; }
.coach-sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.coach-sec li { font-size: 14px; color: var(--text2); line-height: 1.6; }
.coach-more { border-top: 1px solid var(--line); padding: 10px 0 4px; }
.coach-more summary { font-size: 13px; color: var(--text2); cursor: pointer; font-weight: 600; }
.coach-more .ins { margin-top: 10px; }
.btn.ask { width: 100%; margin-top: 10px; border-color: rgba(242, 184, 75, .4); color: var(--accent); }

/* v1.3 — 신발·날씨·대회 준비 */
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; }
.h-plan { font-size: 12px; font-weight: 600; color: var(--text2); margin-left: 6px; }
.week-plan { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text2); align-items: baseline; }
.week-plan b { color: var(--text); margin-right: 2px; }
.week-plan .link { margin-left: auto; }
.wx { margin-left: 8px; color: var(--text2); }
.wx:empty { display: none; }
.wx-row { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); margin: 4px 0 2px; }
.wx-main { color: var(--text); font-weight: 600; }
.coach-note { margin: -4px 0 12px; font-size: 13px; color: var(--text2); background: var(--surface2); border-radius: 10px; padding: 8px 10px; }
.field select { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 15px; width: 100%; }
.shoes { display: flex; flex-direction: column; gap: 10px; }
.shoe { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--surface2); }
.shoe.retired { opacity: .55; }
.shoe-top { display: flex; align-items: center; gap: 8px; }
.shoe-name { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed transparent; color: var(--text); font-weight: 600; font-size: 15px; padding: 2px 0; outline: none; }
.shoe-name:focus { border-bottom-color: var(--muted); }
.shoe-km { font-size: 16px; color: var(--text2); white-space: nowrap; }
.shoe-sub { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 0; }
.shoe-sub input { width: 64px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 4px 6px; margin: 0 3px; text-align: right; }
.shoe-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.shoe-btns .chip.sel { padding: 4px 10px; font-size: 12px; }
.meter.thin { height: 4px; margin: 6px 0 0; }
.ms-add { display: flex; gap: 6px; margin-top: 12px; }
.ms-add input { flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--text); font-size: 14px; }
.ms-add input[type=date] { flex: none; width: 140px; }
.race-goal { position: relative; }
.edit-goal { position: absolute; right: 14px; bottom: 14px; }
.race-goal .goal-gap { margin-top: 10px; padding-right: 90px; }
.goal-form { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.paces td { padding: 7px 2px; border-top: 1px solid var(--line); font-size: 14px; }
.paces tr:first-child td { border-top: 0; }
.paces td.num { font-size: 18px; font-weight: 600; text-align: right; padding-right: 12px; }
.paces td.muted { font-size: 12px; }
.plan-empty p { color: var(--text2); font-size: 14px; margin: 0 0 12px; }
.plan-empty .btn.primary { width: 100%; margin-top: 4px; }
.btn[disabled] { opacity: .45; }
.prog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.prog-grid .lbl { margin-top: 2px; }
.big2 { font-size: 34px; font-weight: 700; line-height: 1.05; }
.phasebar { position: relative; display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: visible; }
.phasebar > div { border-radius: 3px; }
.phasebar .today { position: absolute; top: -5px; width: 2px; height: 20px; background: var(--text); border-radius: 1px; transform: translateX(-1px); }
.phase-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text2); margin-top: 10px; }
.this-week .tw-top { margin-bottom: 4px; }
.days { list-style: none; margin: 10px 0 0; padding: 0; }
.days li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--text2); }
.days li.today { color: var(--text); }
.days li.today .d-dow { color: var(--accent); }
.days li.ran .d-l::before { content: '✓ '; color: #6fd39a; font-weight: 700; }
.days li.skip { opacity: .5; }
.d-dow { font-weight: 700; color: var(--text); }
.d-km { font-size: 15px; color: var(--text); }
.missions { list-style: none; margin: 0; padding: 0; }
.ms { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.ms:first-child { border-top: 0; }
.ms-ic { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface3); display: grid; place-items: center; font-size: 12px; font-weight: 800; margin-top: 1px; }
.ms.done .ms-ic { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ms.late .ms-ic { border-color: var(--serious); color: var(--serious); }
.ms-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ms-main b { font-size: 14px; font-weight: 600; }
.ms.done .ms-main b { color: var(--text2); }
.ms-sub { font-size: 12px; color: var(--muted); }
.ms-ctl { display: flex; align-items: center; gap: 2px; }
.icon-btn.small { width: 30px; height: 30px; }
.icon-btn.small svg { width: 16px; height: 16px; }
.cps { list-style: none; margin: 0; padding: 0; }
.cps li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.cps li:first-child { border-top: 0; }
.cps li > span { font-size: 12px; color: var(--muted); }
.cps .cp-r { grid-column: 1 / -1; color: var(--text2); font-size: 13px; }
.cps li:not(.past) b { color: var(--text2); font-weight: 600; }
details.phase { border-top: 1px solid var(--line); padding: 10px 0; }
details.phase:first-of-type { border-top: 0; }
details.phase summary { display: flex; align-items: baseline; gap: 6px; cursor: pointer; font-size: 14px; }
details.phase summary .muted { font-size: 12px; margin-left: auto; }
details.phase .fine { margin: 6px 0 6px; }
.wk { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.wk-l { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.wk-l b { font-size: 14px; color: var(--text); }
.wk-key { font-size: 13px; color: var(--text); line-height: 1.4; }
.wk-sub { font-size: 12px; color: var(--muted); }
.wk-r { text-align: right; white-space: nowrap; }
.wk-r b { font-size: 18px; }
.wk-st { display: inline-block; width: 16px; margin-left: 4px; color: var(--muted); }
.wk.done .wk-st { color: #6fd39a; }
.wk.partial .wk-st { color: var(--warn); }
.wk.current { background: rgba(242, 184, 75, .08); border-radius: 10px; padding-left: 6px; padding-right: 6px; border-top-color: transparent; }
.wk.current .wk-l b { color: var(--accent); }
.wk.race .wk-key { color: var(--accent); font-weight: 600; }
.plan-opt { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.plan-opt summary { font-size: 13px; color: var(--text2); cursor: pointer; font-weight: 600; }
.plan-opts { margin-top: 10px; }
.plan-opt .btn.ghost { width: 100%; }
.tab { font-size: 10.5px; }

</style>
</head>
<body>
<header class="topbar">
  <button id="backBtn" class="icon-btn" aria-label="뒤로" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title">RunLog</h1>
  <span class="brand" aria-hidden="true">RunLog</span>
</header>
<main id="view"><div class="loading">불러오는 중…</div></main>
<nav class="tabbar" aria-label="메뉴">
  <button class="tab" id="tabRuns" data-tab="runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span>기록</span></button>
  <button class="tab" id="tabStats" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>통계</span></button>
  <button class="tab add" id="tabAdd"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>가져오기</span></button>
  <button class="tab" id="tabRace" data-tab="race"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>대회</span></button>
  <button class="tab" id="tabPrefs" data-tab="prefs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>설정</span></button>
</nav>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="backupInput" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<div id="dialog"></div>
